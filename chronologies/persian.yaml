kind: chronology
id: PERSIAN

metadata:
  name: Persian Arithmetic Calendar (2820-year profile)
  description: |
    This profile is the 2820-year arithmetic approximation, not the astronomical
    civil calendar used in Iran. It preserves the existing 682/2816 leap formula.
    Epoch source: https://www.fourmilab.ch/documents/calendar/ (Persian Algorithmic).

    The first six months have 31 days, the next five have 30 days, and the
    last month has 29 days (30 in leap years). This arithmetic version uses
    a 2820-year cycle approximation for leap years.

structure:
  epoch_jdn: 1948321  # Farvardin 1, 1 AP = 622-03-19 Julian / 622-03-22 Gregorian
  week:
    days:
      - Yekshanbeh    # Sunday
      - Doshanbeh     # Monday
      - Seshhanbeh    # Tuesday
      - Chaharshanbeh # Wednesday
      - Panjshanbeh   # Thursday
      - Jomeh         # Friday
      - Shanbeh       # Saturday
    first_day: Shanbeh
  months:
    - {name: Farvardin, days: 31}
    - {name: Ordibehesht, days: 31}
    - {name: Khordad, days: 31}
    - {name: Tir, days: 31}
    - {name: Mordad, days: 31}
    - {name: Shahrivar, days: 31}
    - {name: Mehr, days: 30}
    - {name: Aban, days: 30}
    - {name: Azar, days: 30}
    - {name: Dey, days: 30}
    - {name: Bahman, days: 30}
    - {name: Esfand, days: 29, leap_days: 30}

algorithms:
  type: FORMULA
  # 2820-year cycle approximation
  # Leap years: ((year - 474) % 2820 + 474 + 38) * 682 % 2816 < 682
  leap_year: "((((year - 474) % 2820) + 474 + 38) * 682 % 2816) < 682"
