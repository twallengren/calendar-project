kind: chronology
id: UMM_AL_QURA

metadata:
  name: Umm al-Qura Calendar
  description: |
    The Umm al-Qura calendar is the official civil Islamic calendar of Saudi Arabia.
    Unlike the tabular Hijri approximation, month boundaries are determined by
    astronomical calculations (and historically, moon sighting) rather than a formula.
    This chronology uses a lookup table sourced from Java's HijrahChronology, which
    implements the Umm al-Qura calendar data.

    Coverage: AH 1356-1500 (~1937-2076 CE).

structure:
  week:
    days:
      - Al-Ahad       # Sunday
      - Al-Ithnayn    # Monday
      - Al-Thulatha   # Tuesday
      - Al-Arbia      # Wednesday
      - Al-Khamis     # Thursday
      - Al-Jumah      # Friday
      - Al-Sabt       # Saturday
    first_day: Al-Sabt
  months:
    - {name: Muharram, days: 30}
    - {name: Safar, days: 29}
    - {name: "Rabi' al-Awwal", days: 30}
    - {name: "Rabi' al-Thani", days: 29}
    - {name: "Jumada al-Awwal", days: 30}
    - {name: "Jumada al-Thani", days: 29}
    - {name: Rajab, days: 30}
    - {name: "Sha'ban", days: 29}
    - {name: Ramadan, days: 30}
    - {name: Shawwal, days: 29}
    - {name: "Dhu al-Qi'dah", days: 30}
    - {name: "Dhu al-Hijjah", days: 29, leap_days: 30}

