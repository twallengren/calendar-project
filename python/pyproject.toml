[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdc-calendars"
dynamic = ["version"]
description = "Trading and business-day calendars with zero dependencies, generated from YAML specs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Toren Wallengren" }]
keywords = [
    "calendar",
    "trading-calendar",
    "business-days",
    "holidays",
    "exchange-calendars",
    "settlement",
    "finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/twallengren/calendar-project"
Source = "https://github.com/twallengren/calendar-project"
Issues = "https://github.com/twallengren/calendar-project/issues"

[tool.hatch.version]
path = "bdc_calendars/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["bdc_calendars"]

[tool.hatch.build.targets.sdist]
include = [
    "/bdc_calendars",
    "/tests",
    "/scripts",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
