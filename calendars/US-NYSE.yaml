kind: calendar
id: US-NYSE

metadata:
  name: NYSE Trading Calendar
  description: New York Stock Exchange trading calendar
  chronology: ISO
  timezone: America/New_York
  mic: XNYS
  aliases: [NYSE]
  coverage:
    from: 1900-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 1900-01-01
        to: 2007-12-31
        quality: VERIFIED
        evidence_ids: [nyse-history-2008]
      # From 2008 the NYSE's own holiday history ends; the scheduled closures are reconciled
      # day by day against two independent index series (blank on every non-trading day) through
      # 12 October 2026, and the exchange's published schedule carries the years ahead.
      - scope: SCHEDULED_CLOSURES
        from: 2008-01-01
        to: 2026-10-12
        quality: VERIFIED
        evidence_ids: [fred-nasdaqcom, fred-sp500, nyse-hours]
      - scope: SCHEDULED_CLOSURES
        from: 2026-10-13
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [nyse-hours, nyse-trading-days-2026-2028]
      - scope: EARLY_CLOSES
        from: 1900-01-01
        to: 2007-12-31
        quality: VERIFIED
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 2008-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [nyse-hours]
      # These Christmas Eves disagree with exchange_calendars, while the NYSE history PDF does
      # not explicitly identify an early close. Keep only the disputed dates unresolved.
      - scope: EARLY_CLOSES
        from: 1973-12-24
        to: 1973-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1979-12-24
        to: 1979-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1980-12-24
        to: 1980-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1981-12-24
        to: 1981-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1984-12-24
        to: 1984-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1985-12-24
        to: 1985-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1986-12-24
        to: 1986-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: EARLY_CLOSES
        from: 1987-12-24
        to: 1987-12-24
        quality: INCOMPLETE
        evidence_ids: [nyse-history-2008]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 1900-01-01
        to: 2007-12-31
        quality: VERIFIED
        evidence_ids: [nyse-history-2008]
      # Every unscheduled closure since 2008 (Hurricane Sandy 2012, the Bush and Carter days of
      # mourning) is cited to the exchange's own release, and the index-series reconciliation
      # shows no other missing trading day through 12 October 2026.
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2008-01-01
        to: 2026-10-12
        quality: VERIFIED
        evidence_ids: [fred-nasdaqcom, fred-sp500, nyse-euronext-sandy-2012-10-28, sec-fr-2013-19145, nyse-pr-bush-2018, finra-rn-18-39, nyse-pr-carter-2024]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2026-10-13
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [nyse-hours]

weekend_shift_policy: NEAREST_WEEKDAY

uses:
  - nyse_weekends
  - us_nyse_holidays

deltas:
  # Good Friday was not observed in 1898, 1906 and 1907 (nyse-history-2008).
  - action: remove
    key: good_friday
    date: 1898-04-08
    source:
      - id: nyse-history-2008
  - action: remove
    key: good_friday
    date: 1906-04-13
    source:
      - id: nyse-history-2008
  - action: remove
    key: good_friday
    date: 1907-03-29
    source:
      - id: nyse-history-2008
