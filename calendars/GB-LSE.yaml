kind: calendar
id: GB-LSE

metadata:
  name: London Stock Exchange
  description: London Stock Exchange (LSE) trading calendar (MIC XLON)
  chronology: ISO
  timezone: Europe/London
  mic: XLON
  coverage:
    from: 2000-01-01
    to: 2030-12-31
    verified_through: 2028-12-31
    quality:
      - {scope: SCHEDULED_CLOSURES, from: 2000-01-01, to: 2020-12-31, quality: PROJECTED, evidence_ids: [uk-1971-act]}
      - {scope: SCHEDULED_CLOSURES, from: 2021-01-01, to: 2023-12-31, quality: VERIFIED, evidence_ids: [govuk-bank-holidays, lse-trading-calendar-2021, lse-trading-calendar-2022, lse-trading-calendar-2023]}
      - {scope: SCHEDULED_CLOSURES, from: 2024-01-01, to: 2025-12-31, quality: PROJECTED, evidence_ids: [govuk-bank-holidays]}
      - {scope: SCHEDULED_CLOSURES, from: 2026-01-01, to: 2028-12-31, quality: VERIFIED, evidence_ids: [lse-business-days, govuk-bank-holidays]}
      - {scope: SCHEDULED_CLOSURES, from: 2029-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [lse-business-days]}
      - {scope: EARLY_CLOSES, from: 2000-01-01, to: 2020-12-31, quality: PROJECTED, evidence_ids: [lse-business-days]}
      - {scope: EARLY_CLOSES, from: 2021-01-01, to: 2023-12-31, quality: VERIFIED, evidence_ids: [lse-trading-calendar-2021, lse-trading-calendar-2022, lse-trading-calendar-2023]}
      - {scope: EARLY_CLOSES, from: 2024-01-01, to: 2025-12-31, quality: PROJECTED, evidence_ids: [lse-business-days]}
      - {scope: EARLY_CLOSES, from: 2026-01-01, to: 2028-12-31, quality: VERIFIED, evidence_ids: [lse-business-days]}
      - {scope: EARLY_CLOSES, from: 2029-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [lse-business-days]}
      # These preceding-Friday half days follow the current LSE rule and agree with both
      # references, but no surviving primary LSE publication for the six years was found.
      - {scope: EARLY_CLOSES, from: 2000-12-22, to: 2000-12-22, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2000-12-29, to: 2000-12-29, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2005-12-23, to: 2005-12-23, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2005-12-30, to: 2005-12-30, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2006-12-22, to: 2006-12-22, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2006-12-29, to: 2006-12-29, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2011-12-23, to: 2011-12-23, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2011-12-30, to: 2011-12-30, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2016-12-23, to: 2016-12-23, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2016-12-30, to: 2016-12-30, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2017-12-22, to: 2017-12-22, quality: INCOMPLETE, evidence_ids: []}
      - {scope: EARLY_CLOSES, from: 2017-12-29, to: 2017-12-29, quality: INCOMPLETE, evidence_ids: []}
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2000-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [lse-business-days]}

# UK-style observance: a bank holiday that falls on a weekend moves to the next weekday not
# already a holiday (cascading), e.g. Christmas Saturday -> Monday, Boxing Day Sunday -> Tuesday.
weekend_shift_policy: NEXT_AVAILABLE_WEEKDAY

uses:
  - weekend_sat_sun
  - gb_lse_holidays
