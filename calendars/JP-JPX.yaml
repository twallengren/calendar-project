kind: calendar
id: JP-JPX

metadata:
  name: Japan Exchange Group (Tokyo Stock Exchange)
  description: >-
    Tokyo Stock Exchange cash equity market trading calendar (MIC XTKS), operated by Japan
    Exchange Group. Closed on Saturdays, Sundays, Japanese national holidays, and JPX's own
    year-end and New Year market holidays (December 31 and January 2-3).
  chronology: ISO
  timezone: Asia/Tokyo
  mic: XTKS
  aliases: [XJPX]
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    # The Cabinet Office's list of national holidays runs to 2027; the two equinox days beyond it
    # are projections. 2010 is the first year with no half-day sessions - see
    # sources/JP-JPX/README.md for why coverage does not start earlier.
    verified_through: 2027-12-31
    quality:
      # JPX's own monthly and annual trading-day counts equal the schedule month by month from 2010.
      - {scope: SCHEDULED_CLOSURES, from: 2010-01-01, to: 2018-12-31, quality: VERIFIED, evidence_ids: [cao-shukujitsu, jpx-market-holidays, jpx-monthly-report-2014-12, jpx-monthly-report-2016-01, jpx-monthly-report-2019-08]}
      - {scope: SCHEDULED_CLOSURES, from: 2019-01-01, to: 2027-12-31, quality: VERIFIED, evidence_ids: [jpx-market-holidays-archive, jpx-market-holidays, cao-shukujitsu]}
      - {scope: SCHEDULED_CLOSURES, from: 2028-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [jpx-market-holidays, cao-shukujitsu-gaiyou]}
      - {scope: EARLY_CLOSES, from: 2010-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [jpx-market-holidays]}
      # The only unscheduled suspension in coverage is 1 October 2020 (modelled). JPX counts it as
      # a trading day, so the statistics verify the schedule while the exchange's releases and
      # press carry the absence of any other market-wide suspension.
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2010-01-01, to: 2026-08-31, quality: VERIFIED, evidence_ids: [jpx-system-failure-2020, jpx-monthly-report-2014-12, jpx-monthly-report-2016-01, jpx-monthly-report-2019-08, jpx-trading-overview-2020, jpx-monthly-report-2026-08, tse-statement-2011-03-14, tse-arrowhead-2018-10-09]}
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2026-09-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [jpx-system-failure-2020]}

# 振替休日, Art. 3(2) of the Act on National Holidays: a national holiday on a Sunday is observed
# on the nearest following day that is not a holiday, cascading past the holidays in between
# (Sunday May 3 2026 -> Wednesday May 6). A Saturday holiday is not observed at all.
weekend_shift_policy: NEXT_AVAILABLE_FROM_LAST_WEEKEND_DAY

uses:
  - weekend_sat_sun
  - jp_jpx_holidays
