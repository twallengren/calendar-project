kind: calendar
id: SA-TADAWUL

metadata:
  name: Tadawul (Saudi Exchange) Trading Calendar
  description: Saudi Stock Exchange (Tadawul) trading calendar with Fri-Sat weekends and Islamic holidays
  chronology: UMM_AL_QURA
  timezone: Asia/Riyadh
  mic: XSAU
  aliases: [TADAWUL]
  coverage:
    from: 2020-01-01
    to: 2030-12-31
    verified_through: 2029-12-31
    quality:
      # The exchange calendar proves the 2020 Eid al-Fitr closure but no longer exposes its 2020
      # Eid al-Adha announcement. A contemporary report says the exchange closed 29 Jul–4 Aug,
      # so the current open answers in that interval are unsafe until the primary notice is found.
      - scope: SCHEDULED_CLOSURES
        from: 2020-01-01
        to: 2020-12-31
        quality: INCOMPLETE
        evidence_ids: [saudi-exchange-announcements, argaam-tadawul-eid-adha-2020]
      - scope: SCHEDULED_CLOSURES
        from: 2021-01-01
        to: 2029-12-31
        quality: VERIFIED
        evidence_ids: [saudi-exchange-announcements]
      - scope: SCHEDULED_CLOSURES
        from: 2030-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [saudi-exchange-announcements]
      - scope: EARLY_CLOSES
        from: 2020-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [saudi-exchange-announcements]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2020-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [saudi-exchange-announcements]

weekend_shift_policy: NEAREST_WEEKDAY

uses:
  - saudi_weekends
  - tadawul_holidays
