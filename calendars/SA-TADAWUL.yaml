kind: calendar
id: SA-TADAWUL

metadata:
  name: Tadawul (Saudi Exchange) Trading Calendar
  description: Saudi Stock Exchange (Tadawul) trading calendar with Fri-Sat weekends and Islamic holidays
  chronology: UMM_AL_QURA
  timezone: Asia/Riyadh
  mic: XSAU
  aliases: [TADAWUL]
  coverage:
    from: 2020-01-01
    to: 2030-12-31
    verified_through: 2029-12-31
    quality:
      # 2020 is established by the exchange's archived Holidays page (Eid al-Fitr) and its two
      # archived market-news notices for Eid al-Adha (29 Jul-4 Aug) and National Day, with no
      # other holiday notice among the year's captured market news.
      - scope: SCHEDULED_CLOSURES
        from: 2020-01-01
        to: 2020-12-31
        quality: VERIFIED
        evidence_ids: [tadawul-holidays-page-2020, tadawul-eid-al-adha-2020-notice, tadawul-national-day-2020-notice, saudi-exchange-announcements]
      - scope: SCHEDULED_CLOSURES
        from: 2021-01-01
        to: 2029-12-31
        quality: VERIFIED
        evidence_ids: [saudi-exchange-announcements, saudi-exchange-tasi-sessions, tadawul-ramadan-eid-notice-2021]
      - scope: SCHEDULED_CLOSURES
        from: 2030-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [saudi-exchange-announcements]
      - scope: EARLY_CLOSES
        from: 2020-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [saudi-exchange-announcements]
      # The exchange's own day-level session record and its published trading-day counts
      # reconcile with the schedule plus the one unscheduled closure (23 November 2022).
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2020-01-01
        to: 2026-10-13
        quality: VERIFIED
        evidence_ids: [saudi-exchange-tasi-sessions, saudi-exchange-statistical-reports, saudi-exchange-closure-2022-11-23, saudi-exchange-halt-2021-06-02, saudi-exchange-halt-2026-08-19]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2026-10-14
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [saudi-exchange-announcements]

weekend_shift_policy: NEAREST_WEEKDAY

uses:
  - saudi_weekends
  - tadawul_holidays
