kind: calendar
id: BR-B3

metadata:
  name: B3 - Brasil Bolsa Balcão
  description: B3 (São Paulo) listed equities and derivatives trading calendar (MIC BVMF)
  chronology: ISO
  timezone: America/Sao_Paulo
  mic: BVMF
  coverage:
    from: 2010-01-01
    to: 2027-12-31
    verified_through: 2026-12-31
    quality:
      # The exchange's annual calendars list every non-trading day 2010-2026 and the generated
      # calendar reproduces them exactly; the exchange's official monthly session counts for
      # 2010-2015 and its stated 2019 and 2021 totals agree. 2027 follows the law and ANBIMA's
      # list until the exchange publishes its circular.
      - {scope: SCHEDULED_CLOSURES, from: 2010-01-01, to: 2026-12-31, quality: VERIFIED, evidence_ids: [b3-calendars, bmfbovespa-calendar-2014, bmfbovespa-numero-mensal-de-pregoes, b3-oc-068-2020, b3-oc-072-2020, b3-ce-001-2021, b3-oc-215-2023, b3-news-2025-11-17, br-lei-662-1949, br-lei-14759-2023]}
      - {scope: SCHEDULED_CLOSURES, from: 2027-01-01, to: 2027-12-31, quality: PROJECTED, evidence_ids: [anbima-feriados-2027, br-lei-662-1949]}
      # No shortened session exists: the calendars list none, Ash Wednesday is a late open with
      # the normal close, and the hours circulars fix the close by New York's daylight-saving
      # state on every trading day.
      - {scope: EARLY_CLOSES, from: 2010-01-01, to: 2026-12-31, quality: VERIFIED, evidence_ids: [b3-calendars, b3-ash-wednesday-circulars, bmfbovespa-hours-news, b3-hours-circulars]}
      - {scope: EARLY_CLOSES, from: 2027-01-01, to: 2027-12-31, quality: PROJECTED, evidence_ids: [b3-hours-circulars]}
      # The exchange's official monthly session counts cover 2010-2015 and leave no room for an
      # unrecorded closure; from 2016 the record is the exchange's circulars and the press
      # (circuit breakers, intraday faults and the delayed open of 31 July 2026, none of which
      # shortened a day), with no count reconciliation, so the scope stays PROJECTED.
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2010-01-01, to: 2015-12-31, quality: VERIFIED, evidence_ids: [bmfbovespa-numero-mensal-de-pregoes, bmfbovespa-calendar-2014, press-exame-2010-11-22]}
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2016-01-01, to: 2027-12-31, quality: PROJECTED, evidence_ids: [b3-ce-009-2020-circuit-breaker, press-istoedinheiro-2017-05-18, press-moneytimes-2020-03-18, press-istoedinheiro-2025-08-01, press-infomoney-2026-07-31, press-noticiasagricolas-2026-07-31]}

# Brazil has no weekend substitution; every fixed-date holiday carries shift_policy NONE.
weekend_shift_policy: NONE

uses:
  - weekend_sat_sun
  - br_b3_holidays
