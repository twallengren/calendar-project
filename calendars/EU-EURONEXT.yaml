kind: calendar
id: EU-EURONEXT

# Shared base for the Euronext cash markets. Euronext publishes a single "Calendar of business
# days" covering Amsterdam, Brussels, Lisbon and Paris, and for these four venues the closure
# dates are identical in every year covered here (2010-2026). This calendar holds that shared
# set; the four venue calendars extend it and add only what is venue-local, namely the
# timezone and the local wall-clock time of the 24/31 December half trading days.
#
# It is a base calendar, not a market: Euronext does not trade under a MIC of its own.

metadata:
  name: Euronext Cash Markets Base Calendar
  description: Shared holiday calendar for the Euronext cash markets (Amsterdam, Brussels, Lisbon, Paris)
  kind: base
  chronology: ISO
  timezone: Europe/Paris
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 2010-01-01
        to: 2026-12-31
        quality: VERIFIED
        evidence_ids: [nyse-euronext-calendar-2010, nyse-euronext-calendar-2011, nyse-euronext-calendar-2012, nyse-euronext-calendar-2013, euronext-calendars-hours-archive, euronext-hours-holidays, euronext-holiday-calendar-2026]
      - scope: SCHEDULED_CLOSURES
        from: 2027-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [euronext-hours-holidays]
      # Half days are venue-local and are added by the four market calendars.
      - scope: EARLY_CLOSES
        from: 2010-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [euronext-hours-holidays]
      # Euronext's own trading-day counts (10-K 2010-2012, December volume releases, the monthly
      # historical-volumes workbook to September 2026) equal the schedule in every year, so no
      # unscheduled full-day closure occurred; the 2018 and 2020 Optiq disruptions ended with a
      # (degraded) close and are counted by the exchange as trading days.
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2010-01-01
        to: 2026-09-30
        quality: VERIFIED
        evidence_ids: [nyse-euronext-10k-2012, euronext-volumes-dec-2014, euronext-volumes-dec-2015, euronext-volumes-dec-2016, euronext-monthly-historical-volumes, euronext-market-status-2020-10-19]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2026-10-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [euronext-hours-holidays]

# Euronext does not observe a weekend holiday on a neighbouring weekday. Every year in
# coverage in which New Year's Day, Labour Day, Christmas Day or Boxing Day fell on a weekend,
# the yearly calendar either omits it or lists the neighbouring weekday as a full trading day
# for these four venues (the "substitute" rows apply to Euronext Dublin only).
weekend_shift_policy: NONE

uses:
  - weekend_sat_sun
  - euronext_holidays
