kind: calendar
id: HK-HKEX

metadata:
  name: Hong Kong Exchanges and Clearing
  description: >-
    Securities market of The Stock Exchange of Hong Kong Limited, operated by Hong Kong Exchanges
    and Clearing Limited (MIC XHKG). Trading runs Monday to Friday; the market is closed on every
    Hong Kong general holiday (General Holidays Ordinance, Cap. 149) that falls on a weekday, and
    trades a morning session only (12:00 noon close) on Christmas Eve, New Year's Eve and Lunar
    New Year's Eve. Hong Kong observance: a general holiday falling on a Sunday is observed on the
    following weekday; a general holiday falling on a Saturday is not substituted. Lunar
    holidays retain CHINESE_HK native origins and Ching Ming uses a bounded HKO reference
    table. Every resulting closure remains bounded to, and confirmed against, the Government and
    exchange schedules through the last gazetted year (2027); computed future dates are not
    published as confirmed holidays. Unscheduled severe-weather closures before HKEX began
    trading through severe weather on 23 September 2024 are modelled as explicit, individually
    cited dates: six whole-day cancellations (Typhoon Signal No. 8 or above, a Black Rainstorm
    Warning or Extreme Conditions in force at noon) and two afternoon sessions terminated at
    13:55 when Signal No. 8 was issued mid-session. Days on which only the morning session was
    cancelled traded to the scheduled close and are ordinary business days; a late open is not
    an event in this model.
  chronology: ISO
  timezone: Asia/Hong_Kong
  mic: XHKG
  coverage:
    from: 2018-01-01
    to: 2027-12-31
    verified_through: 2027-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 2018-01-01
        to: 2027-12-31
        quality: VERIFIED
        evidence_ids: [hkex-calendar, hkex-calendar-archived, govhk-general-holidays]
      - scope: EARLY_CLOSES
        from: 2018-01-01
        to: 2027-12-31
        quality: VERIFIED
        evidence_ids: [hkex-calendar, hkex-calendar-archived, hkex-securities-trading-hours]
      # Before severe-weather trading began, same-day typhoon/rainstorm cancellations were
      # possible. They are enumerated exhaustively from the Observatory's warnings database and
      # the exchange's published arrangements, every affected day is cited to its own HKEX
      # notice (see modules/holidays/hk_hkex_severe_weather.yaml), and HKEX's own count of
      # closures since 2018 corroborates the set, so this interval is verified rather than
      # incomplete.
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2018-01-01
        to: 2024-09-22
        quality: VERIFIED
        evidence_ids: [hko-warnings-database, hkex-severe-weather-arrangements-2023, hkex-swt-consultation-2023]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2024-09-23
        to: 2027-12-31
        quality: PROJECTED
        evidence_ids: [hkex-severe-weather-trading]

# Hong Kong observance under the General Holidays Ordinance: a general holiday that falls on a
# Sunday (the last day of the weekend block) is observed on the following weekday; a general
# holiday that falls on a Saturday is not substituted. FORWARD_ONLY is exactly that rule.
weekend_shift_policy: FORWARD_ONLY

uses:
  - weekend_sat_sun
  - hk_hkex_holidays

deltas:
  # HKO and the gazetted/HKEX schedules put 2027 Lunar New Year on 6 February. ICU4J 78.3's
  # near-midnight calculation starts M01 on 7 February. Replace every affected generated row so
  # the market dates and labels stay authoritative without attaching a false ICU native origin.
  - action: remove
    key: hk_lunar_new_year
    date: 2027-02-08
    source:
      - id: hko-gregorian-lunar-conversion
        ref: "T2027e.txt: 6 February is the 1st Lunar Month; 8 February is day 3"
      - id: govhk-general-holidays
        ref: "2027 gazetted Lunar New Year holidays"
      - id: hkex-calendar
        ref: "2027 Hong Kong Market is closed rows"
  - action: remove
    key: hk_lunar_new_year
    date: 2027-02-09
    source:
      - id: hko-gregorian-lunar-conversion
      - id: govhk-general-holidays
      - id: hkex-calendar
  - action: remove
    key: hk_lunar_new_year
    date: 2027-02-10
    source:
      - id: hko-gregorian-lunar-conversion
      - id: govhk-general-holidays
      - id: hkex-calendar
  - action: add
    key: hk_lunar_new_year
    name: Lunar New Year (The third day of Lunar New Year)
    date: 2027-02-08
    classification: CLOSED
    source:
      - id: hko-gregorian-lunar-conversion
      - id: govhk-general-holidays
      - id: hkex-calendar
  - action: add
    key: hk_lunar_new_year
    name: Lunar New Year (The fourth day of Lunar New Year)
    date: 2027-02-09
    classification: CLOSED
    source:
      - id: hko-gregorian-lunar-conversion
      - id: govhk-general-holidays
      - id: hkex-calendar
