kind: calendar
id: PT-EURONEXT-LISBON

# Euronext Lisbon (XLIS), one of the four Euronext cash markets that share the holiday calendar in
# EU-EURONEXT. No closure in the Euronext yearly calendars for 2010-2026 applies to Euronext Lisbon
# and not to the other three, so this calendar adds no closures of its own.
# Its local wall clock is WET/WEST, one hour behind the CET that Euronext quotes the
# half-day close in, so it uses the *_lisbon half-day modules (13:05 local, not 14:05).

metadata:
  name: Euronext Lisbon Trading Calendar
  description: Euronext Lisbon (XLIS) cash market trading calendar
  kind: market
  chronology: ISO
  timezone: Europe/Lisbon
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2026-12-31

extends:
  - EU-EURONEXT

uses:
  - euronext_christmas_eve_lisbon
  - euronext_new_years_eve_lisbon
