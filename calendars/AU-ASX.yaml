kind: calendar
id: AU-ASX

metadata:
  name: Australian Securities Exchange
  description: ASX Trade cash equities market trading calendar (MIC XASX)
  chronology: ISO
  timezone: Australia/Sydney
  mic: XASX
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2027-12-31
    quality:
      # The exchange publishes a complete cash-market calendar for each year ("any weekday not
      # included in this list ... [is] a 'Business Day' and a 'Trading Day'"); the 2020 and
      # 2022-2027 calendars survive online. 2010-2019 and 2021 follow the NSW public-holiday
      # rules with the exchange's monthly trading-day counts and notices confirming the
      # substitute-day decisions (26 April 2010 and 2011 closed; 27 April 2015, 27 April 2020,
      # 26 April 2021 and 27 April 2026 open).
      - {scope: SCHEDULED_CLOSURES, from: 2010-01-01, to: 2019-12-31, quality: PROJECTED, evidence_ids: [nsw-public-holidays-act, asx-activity-report-2011-04, asx-activity-report-2012-01, asx-activity-report-2015-04, asx-events-2016-04, asx-events-2018-12, asx24-trading-calendar-2019]}
      - {scope: SCHEDULED_CLOSURES, from: 2020-01-01, to: 2020-12-31, quality: VERIFIED, evidence_ids: [asx-trade-calendar-2020]}
      - {scope: SCHEDULED_CLOSURES, from: 2021-01-01, to: 2021-12-31, quality: PROJECTED, evidence_ids: [nsw-public-holidays-act, asx-notice-1320-20-10, asx-notice-0812-18-07, asx-activity-report-2021-04, asx-notice-1639-21-11]}
      - {scope: SCHEDULED_CLOSURES, from: 2022-01-01, to: 2027-12-31, quality: VERIFIED, evidence_ids: [asx-trade-calendar-2022, asx-trade-calendar-2023, asx-trade-calendar-2024, asx-notice-0840-23-08, asx-trade-calendar-2025, asx-trade-calendar-2026, asx-trade-calendar-2026-2027]}
      - {scope: SCHEDULED_CLOSURES, from: 2028-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [nsw-public-holidays-act]}
      # Early closes only ever fall in December (14:10 on the last trading day before Christmas
      # and before New Year through 2016; on 24 and 31 December only, from 2017). The exchange's
      # December notices verify each December from 2016; the practice before 2016 is attested
      # only by press (24 and 31 December 2010).
      - {scope: EARLY_CLOSES, from: 2010-01-01, to: 2016-11-30, quality: PROJECTED, evidence_ids: [fnarena-2010-12-24, asx-notice-1514-16-12]}
      - {scope: EARLY_CLOSES, from: 2016-12-01, to: 2016-12-31, quality: VERIFIED, evidence_ids: [asx-notice-1514-16-12, asx-events-2016-12, asx-event-2016-12-23]}
      - {scope: EARLY_CLOSES, from: 2017-01-01, to: 2017-11-30, quality: PROJECTED, evidence_ids: [asx-notice-1357-16-11]}
      - {scope: EARLY_CLOSES, from: 2017-12-01, to: 2017-12-31, quality: VERIFIED, evidence_ids: [asx-notice-1357-16-11, asx-notice-1305-17-11]}
      - {scope: EARLY_CLOSES, from: 2018-01-01, to: 2018-11-30, quality: PROJECTED, evidence_ids: [asx-notice-1357-16-11]}
      - {scope: EARLY_CLOSES, from: 2018-12-01, to: 2018-12-31, quality: VERIFIED, evidence_ids: [asx-notice-1396-18-12]}
      - {scope: EARLY_CLOSES, from: 2019-01-01, to: 2019-12-31, quality: PROJECTED, evidence_ids: [asx-notice-1357-16-11]}
      - {scope: EARLY_CLOSES, from: 2020-01-01, to: 2020-12-31, quality: VERIFIED, evidence_ids: [asx-trade-calendar-2020, asx-notice-1541-20-11]}
      - {scope: EARLY_CLOSES, from: 2021-01-01, to: 2021-11-30, quality: PROJECTED, evidence_ids: [asx-notice-1357-16-11]}
      - {scope: EARLY_CLOSES, from: 2021-12-01, to: 2021-12-31, quality: VERIFIED, evidence_ids: [asx-notice-1639-21-11]}
      - {scope: EARLY_CLOSES, from: 2022-01-01, to: 2027-12-31, quality: VERIFIED, evidence_ids: [asx-trade-calendar-2022, asx-notice-1253-22-11, asx-trade-calendar-2023, asx-trade-calendar-2024, asx-trade-calendar-2025, asx-trade-calendar-2026, asx-trade-calendar-2026-2027]}
      - {scope: EARLY_CLOSES, from: 2028-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [asx-notice-1357-16-11]}
      # Every market-wide disruption the exchange or ASIC reported since 2010 is modelled (19
      # September 2016 and 16 November 2020 as early terminations; 27 October 2011 and the
      # 2011 partial outages ended in normal closes) and the 2022 National Day of Mourning is a
      # closure. The exchange's monthly trading-day counts reconcile only the months cited, so
      # the scope stays PROJECTED until a complete count reconciliation is on file.
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2010-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [asx-notice-1111-16-09, asx-market-outage-report-2020-12-04, asx-notice-0984-22-09, asx-media-release-2011-10-27, asx-activity-report-2020-11, asx-activity-report-2022-09]}

# NSW-style observance: a public holiday that falls on a weekend is followed by an additional
# holiday on the next weekday not already a holiday (Christmas Saturday -> Monday, Boxing Day
# Sunday -> Tuesday, Australia Day weekend -> Monday). ANZAC Day opts out with shift_policy: NONE.
weekend_shift_policy: NEXT_AVAILABLE_WEEKDAY

uses:
  - weekend_sat_sun
  - au_asx_holidays
