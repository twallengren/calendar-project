      - {scope: SCHEDULED_CLOSURES, from: 2017-01-01, to: 2017-12-31, quality: PROJECTED, evidence_ids: [za-public-holidays-act, jse-hotline-200-2016, jse-hotline-147-2017]}
      - {scope: SCHEDULED_CLOSURES, from: 2018-01-01, to: 2026-12-31, quality: VERIFIED, evidence_ids: [jse-notice-406-2017, jse-notice-395-2018, jse-notice-73-2019, jse-notice-72-2019, jse-notice-303-2019, jse-notice-517-2020, jse-notice-481a-2021, jse-notice-393-2021, jse-notice-600-2022, jse-notice-511-2022, jse-hotline-169-2023, jse-notice-323-2023, jse-notice-061-2024, jse-hotline-057-2024, jse-notice-305-2024, jse-notice-380-2025, sanews-2026-09-15]}
