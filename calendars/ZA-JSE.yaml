      # The exchange shortens 24 and 31 December (or the preceding business day) to a 12:00 close
      # by a December schedule each year; those Decembers are VERIFIED where the schedule was
      # located (2010, 2011, 2014-2025) and the 26 April 2019 go-live early close by its notice.
      # Other months rest on the exchange's practice of announcing any other early close by
      # notice (none found besides 2019), so they stay PROJECTED.
