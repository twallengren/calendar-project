      # No disruption since 2010 shortened a trading day (delayed opens on 27 July 2010, 15
      # September 2014, 21 September 2017, 18 June 2018 and 18 August 2021, the 6 July 2022 halt
      # and the 6 December 2013 pause all ended with the normal or an extended close), but the
      # exchange publishes no trading-day count, so there is no independent reconciliation.
      - {scope: UNSCHEDULED_EXCEPTIONS, from: 2010-01-01, to: 2030-12-31, quality: PROJECTED, evidence_ids: [jse-notice-f4396-2010, jse-notice-171-2013, jse-hotline-180-2017, jse-hotline-109-2018, jse-hotline-175-2021, jse-hotline-101-2022, jse-hotline-168-2024, jse-hotline-060-2020]}

# Public Holidays Act 36 of 1994, s 2(1): a public holiday on a Sunday makes the following Monday
# a public holiday; a Saturday holiday is not substituted. FORWARD_ONLY shifts only from the last
# weekend day. Christmas Day opts out (its Monday is already the Day of Goodwill).
weekend_shift_policy: FORWARD_ONLY

uses:
  - weekend_sat_sun
  - za_jse_holidays
