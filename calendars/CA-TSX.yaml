kind: calendar
id: CA-TSX

metadata:
  name: Toronto Stock Exchange
  description: Toronto Stock Exchange (TSX, MIC XTSE) trading calendar
  chronology: ISO
  timezone: America/Toronto
  mic: XTSE
  coverage:
    from: 2000-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 2000-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page, holidays-act-canada, ontario-family-day-2007]
      - scope: EARLY_CLOSES
        from: 2000-01-01
        to: 2009-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page]
      - scope: EARLY_CLOSES
        from: 2010-01-01
        to: 2014-12-31
        quality: INCOMPLETE
        evidence_ids: [tsx-calendar-page]
      - scope: EARLY_CLOSES
        from: 2015-01-01
        to: 2024-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page]
      - scope: EARLY_CLOSES
        from: 2025-01-01
        to: 2026-12-31
        quality: VERIFIED
        evidence_ids: [tsx-calendar-page, tmx-holiday-schedule-2025]
      - scope: EARLY_CLOSES
        from: 2027-01-01
        to: 2030-12-31
        quality: INCOMPLETE
        evidence_ids: [tsx-calendar-page]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2000-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2001-09-11
        to: 2001-09-12
        quality: INCOMPLETE
        evidence_ids: [tsx-calendar-page]

# UK/Canadian-style cascading observance: a holiday on a weekend moves to the next
# available weekday (see sources/CA-TSX/README.md, tmx-holiday-schedule-2021).
weekend_shift_policy: NEXT_AVAILABLE_WEEKDAY

uses:
  - weekend_sat_sun
  - ca_tsx_holidays

# Christmas/Boxing Day ordering when Christmas Day falls on a Sunday is expressed on the
# ca_christmas event source itself (`displaces: [ca_boxing_day]`, see modules/holidays/
# ca_christmas.yaml and spec/SPEC.md "Observance priority"): Christmas takes the Monday
# "in lieu of Christmas Day" and Boxing Day re-cascades to the Tuesday. Nothing needs
# correcting at the calendar level any more.
