kind: calendar
id: CA-TSX

metadata:
  name: Toronto Stock Exchange
  description: Toronto Stock Exchange (TSX, MIC XTSE) trading calendar
  chronology: ISO
  timezone: America/Toronto
  mic: XTSE
  coverage:
    from: 2000-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
      # TMX's year-end trading-day counts reconcile with the modelled schedule in every year
      # 2008-2025; the statutes and the annual schedule pages carry the rest.
      - scope: SCHEDULED_CLOSURES
        from: 2000-01-01
        to: 2007-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page, holidays-act-canada, ontario-family-day-2007]
      - scope: SCHEDULED_CLOSURES
        from: 2008-01-01
        to: 2025-12-31
        quality: VERIFIED
        evidence_ids: [tsx-stats-dec-2009, tmx-stats-dec-2011, tmx-stats-dec-2012, tmx-stats-dec-2013, tmx-stats-dec-2014, tmx-stats-dec-2015, tmx-stats-dec-2016, tmx-stats-dec-2018, tmx-stats-dec-2019, tmx-stats-dec-2021, tmx-stats-dec-2022, tmx-stats-dec-2023, tmx-stats-dec-2024, tmx-stats-dec-2025, tsx-calendar-page, holidays-act-canada, ontario-family-day-2007]
      - scope: SCHEDULED_CLOSURES
        from: 2026-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page, holidays-act-canada, ontario-family-day-2007]
      # The Christmas Eve 1 p.m. session is evidenced from 2009 by TMX's year-end accounting
      # (half a day in every weekday-24-December year) and by the annual schedule notices; the
      # three unscheduled early terminations (2001, 2018, 2020) are each an exchange release.
      - scope: EARLY_CLOSES
        from: 2000-01-01
        to: 2008-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page]
      - scope: EARLY_CLOSES
        from: 2001-09-11
        to: 2001-09-11
        quality: VERIFIED
        evidence_ids: [tse-2001-09-11-market-closed, cbc-2002-09-11-tsx]
      - scope: EARLY_CLOSES
        from: 2009-01-01
        to: 2025-12-31
        quality: VERIFIED
        evidence_ids: [tsx-stats-dec-2009, tmx-stats-dec-2011, tmx-stats-dec-2012, tmx-stats-dec-2013, tmx-stats-dec-2014, tmx-stats-dec-2015, tmx-stats-dec-2016, tmx-stats-dec-2018, tmx-stats-dec-2019, tmx-stats-dec-2021, tmx-stats-dec-2022, tmx-stats-dec-2023, tmx-stats-dec-2024, tmx-stats-dec-2025, tmx-2018-04-28-outage-update, tmx-2020-02-27-incident-report, tsx-calendar-page, tmx-holiday-schedule-2025]
      - scope: EARLY_CLOSES
        from: 2026-01-01
        to: 2026-12-31
        quality: VERIFIED
        evidence_ids: [tsx-calendar-page, tmx-holiday-schedule-2025]
      - scope: EARLY_CLOSES
        from: 2027-01-01
        to: 2030-12-31
        quality: INCOMPLETE
        evidence_ids: [tsx-calendar-page]
      # 2000-2007: the exchange's releases establish the 2001 closure and early termination and
      # the 2000 incidents that completed their sessions, but no exchange year-end count was found,
      # so the period rests on those releases plus vendor index data and stays projected. From
      # 2008 TMX's own trading-day counts reconcile every year with the schedule plus the modelled
      # exceptions (2008 is one day short, for 17 December 2008).
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2000-01-01
        to: 2007-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page, tse-2001-09-11-market-closed, tse-2001-09-12-closed]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2008-01-01
        to: 2025-12-31
        quality: VERIFIED
        evidence_ids: [tsx-stats-dec-2009, tmx-stats-dec-2011, tmx-stats-dec-2012, tmx-stats-dec-2013, tmx-stats-dec-2014, tmx-stats-dec-2015, tmx-stats-dec-2016, tmx-stats-dec-2018, tmx-stats-dec-2019, tmx-stats-dec-2021, tmx-stats-dec-2022, tmx-stats-dec-2023, tmx-stats-dec-2024, tmx-stats-dec-2025, tmx-2008-12-18-trading-resumes, tmx-2018-04-28-outage-update, tmx-2020-02-27-incident-report, tmx-2022-11-01-ops-notice]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2026-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [tsx-calendar-page]

# UK/Canadian-style cascading observance: a holiday on a weekend moves to the next
# available weekday (see sources/CA-TSX/README.md, tmx-holiday-schedule-2021).
weekend_shift_policy: NEXT_AVAILABLE_WEEKDAY

uses:
  - weekend_sat_sun
  - ca_tsx_holidays

# Christmas/Boxing Day ordering when Christmas Day falls on a Sunday is expressed on the
# ca_christmas event source itself (`displaces: [ca_boxing_day]`, see modules/holidays/
# ca_christmas.yaml and spec/SPEC.md "Observance priority"): Christmas takes the Monday
# "in lieu of Christmas Day" and Boxing Day re-cascades to the Tuesday. Nothing needs
# correcting at the calendar level any more.
