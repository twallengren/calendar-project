kind: calendar
id: FR-EURONEXT-PARIS

# Euronext Paris (XPAR), one of the four Euronext cash markets that share the holiday calendar in
# EU-EURONEXT. No closure in the Euronext yearly calendars for 2010-2026 applies to Euronext Paris
# and not to the other three, so this calendar adds no closures of its own.
# Its local wall clock is CET/CEST, the zone Euronext quotes the half-day close in,
# so it uses the plain half-day modules.

metadata:
  name: Euronext Paris Trading Calendar
  description: Euronext Paris (XPAR) cash market trading calendar
  kind: market
  chronology: ISO
  timezone: Europe/Paris
  mic: XPAR
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 2010-01-01
        to: 2026-12-31
        quality: VERIFIED
        evidence_ids: [nyse-euronext-calendar-2010, nyse-euronext-calendar-2011, nyse-euronext-calendar-2012, nyse-euronext-calendar-2013, euronext-calendars-hours-archive, euronext-hours-holidays, euronext-holiday-calendar-2026]
