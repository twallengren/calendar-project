kind: calendar
id: FR-EURONEXT-PARIS

# Euronext Paris (XPAR), one of the four Euronext cash markets that share the holiday calendar in
# EU-EURONEXT. No closure in the Euronext yearly calendars for 2010-2026 applies to Euronext Paris
# and not to the other three, so this calendar adds no closures of its own.
# Its local wall clock is CET/CEST, the zone Euronext quotes the half-day close in,
# so it uses the plain half-day modules.

metadata:
  name: Euronext Paris Trading Calendar
  description: Euronext Paris (XPAR) cash market trading calendar
  kind: market
  chronology: ISO
  timezone: Europe/Paris
  mic: XPAR
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 2010-01-01
        to: 2026-12-31
        quality: VERIFIED
        evidence_ids: [nyse-euronext-calendar-2010, nyse-euronext-calendar-2011, nyse-euronext-calendar-2012, nyse-euronext-calendar-2013, euronext-calendars-hours-archive, euronext-hours-holidays, euronext-holiday-calendar-2026]
      - scope: SCHEDULED_CLOSURES
        from: 2027-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [euronext-hours-holidays]
      - scope: EARLY_CLOSES
        from: 2010-01-01
        to: 2026-12-31
        quality: VERIFIED
        evidence_ids: [nyse-euronext-calendar-2010, nyse-euronext-calendar-2011, nyse-euronext-calendar-2012, nyse-euronext-calendar-2013, euronext-calendars-hours-archive, euronext-hours-holidays, euronext-holiday-calendar-2026]
      - {scope: EARLY_CLOSES, from: 2010-12-24, to: 2010-12-24, quality: INCOMPLETE, evidence_ids: [nyse-euronext-calendar-2010]}
      - {scope: EARLY_CLOSES, from: 2010-12-31, to: 2010-12-31, quality: INCOMPLETE, evidence_ids: [nyse-euronext-calendar-2010]}
      - {scope: EARLY_CLOSES, from: 2012-12-24, to: 2012-12-24, quality: INCOMPLETE, evidence_ids: [nyse-euronext-calendar-2012]}
      - {scope: EARLY_CLOSES, from: 2012-12-31, to: 2012-12-31, quality: INCOMPLETE, evidence_ids: [nyse-euronext-calendar-2012]}
      - {scope: EARLY_CLOSES, from: 2013-12-24, to: 2013-12-24, quality: INCOMPLETE, evidence_ids: [nyse-euronext-calendar-2013]}
      - {scope: EARLY_CLOSES, from: 2013-12-31, to: 2013-12-31, quality: INCOMPLETE, evidence_ids: [nyse-euronext-calendar-2013]}
      - scope: EARLY_CLOSES
        from: 2027-01-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [euronext-hours-holidays]
      # Euronext's own trading-day counts (10-K 2010-2012, December volume releases, the monthly
      # historical-volumes workbook to September 2026) equal the schedule in every year, so no
      # unscheduled full-day closure occurred; the 2018 and 2020 Optiq disruptions ended with a
      # (degraded) close and are counted by the exchange as trading days.
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2010-01-01
        to: 2026-09-30
        quality: VERIFIED
        evidence_ids: [nyse-euronext-10k-2012, euronext-volumes-dec-2014, euronext-volumes-dec-2015, euronext-volumes-dec-2016, euronext-monthly-historical-volumes, euronext-market-status-2020-10-19]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2026-10-01
        to: 2030-12-31
        quality: PROJECTED
        evidence_ids: [euronext-hours-holidays]

extends:
  - EU-EURONEXT

uses:
  - euronext_christmas_eve
  - euronext_new_years_eve
