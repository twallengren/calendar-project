kind: calendar
id: IL-TASE

metadata:
  name: Tel Aviv Stock Exchange
  description: >-
    Tel Aviv Stock Exchange (TASE) equity trading calendar. Scheduled closures are complete and
    verified for 2025 through 2028 from TASE's own vacation schedules, each row retained as a
    bounded Hebrew-calendar origin. Trading moved from a Sunday-Thursday week to Monday-Friday on
    4 January 2026; every Friday session since then closes at 13:50 and the non-Friday
    intermediate days of Passover and Sukkot close at 14:30. Exact 2025 shortened-session close
    times and unscheduled exceptions remain incomplete.
  # TASE publishes civil session dates in ISO; individual Jewish events below retain HEBREW
  # native origins and are converted to ISO by the compiler.
  chronology: ISO
  timezone: Asia/Jerusalem
  mic: XTAE
  aliases: [TASE]
  coverage:
    from: 2025-01-01
    to: 2028-12-31
    verified_through: 2028-12-31
    quality:
      # 2025 from TASE's one-page vacation schedule PDF; 2026-2028 from TASE's vacation schedule
      # page, whose rendered Hebrew and English tables are preserved as a local evidence file and
      # whose every row re-derives from its Hebrew date with the repository's Hebrew profile.
      - scope: SCHEDULED_CLOSURES
        from: 2025-01-01
        to: 2025-12-31
        quality: VERIFIED
        evidence_ids: [tase-vacation-schedule-2025]
      - scope: SCHEDULED_CLOSURES
        from: 2026-01-01
        to: 2028-12-31
        quality: VERIFIED
        evidence_ids: [tase-trading-vacation-schedule, tase-weekly-review-2026-04-20, isa-trading-week-2026]

      # The vacation schedule proves which 2025 dates were shortened, but the preserved board
      # resolution was conditional on later ISA approval and does not prove an operative 14:30
      # close. No 2025 EARLY_CLOSE events are emitted until that effective notice is sourced.
      - scope: EARLY_CLOSES
        from: 2025-01-01
        to: 2026-01-03
        quality: INCOMPLETE
        evidence_ids: [tase-vacation-schedule-2025, tase-board-trading-hours-2024]
      # Under the Monday-Friday week TASE's own trading-hour tables fix every Friday at 13:50 and
      # every non-Friday intermediate day of Passover and Sukkot at 14:30, and the page names the
      # intermediate-day ranges for each year.
      - scope: EARLY_CLOSES
        from: 2026-01-04
        to: 2028-12-31
        quality: VERIFIED
        evidence_ids: [tase-trading-vacation-schedule, tase-tradingdays-change, isa-trading-week-2026]

      # No emergency or ad-hoc closure is inferred from silence in an annual schedule: the past
      # stays incomplete until trading-day counts or exchange notices establish it, and the future
      # is a projection of the schedule, as for every other calendar.
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2025-01-01
        to: 2026-10-13
        quality: INCOMPLETE
        evidence_ids: [tase-vacation-schedule-2025, tase-trading-vacation-schedule]
      - scope: UNSCHEDULED_EXCEPTIONS
        from: 2026-10-14
        to: 2028-12-31
        quality: PROJECTED
        evidence_ids: [tase-trading-vacation-schedule]

weekend_shift_policy: NONE

uses:
  - tase_weekends
  - tase_holidays
