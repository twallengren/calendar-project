kind: calendar
id: IL-TASE

metadata:
  name: Tel Aviv Stock Exchange
  description: >-
    Tel Aviv Stock Exchange (TASE) equity trading calendar. Scheduled closures are complete for
    2025. The 2026-2027 range deliberately contains only the verified trading-week change,
    verified Q1 Friday sessions, and two individually announced April 2026 closures. Exact 2025
    shortened-session close times, other scheduled closures, and unscheduled exceptions remain
    incomplete.
  # TASE publishes civil session dates in ISO; individual Jewish events below retain HEBREW
  # native origins and are converted to ISO by the compiler.
  chronology: ISO
  timezone: Asia/Jerusalem
  mic: XTAE
  aliases: [TASE]
  coverage:
    from: 2025-01-01
    to: 2027-12-31
    verified_through: 2025-12-31
    quality:
      - scope: SCHEDULED_CLOSURES
        from: 2025-01-01
        to: 2025-12-31
        quality: VERIFIED
        evidence_ids: [tase-vacation-schedule-2025]
      - scope: SCHEDULED_CLOSURES
        from: 2026-01-01
        to: 2026-04-20
        quality: INCOMPLETE
        evidence_ids: [isa-trading-week-2026, tase-q1-2026-report]
      - scope: SCHEDULED_CLOSURES
        from: 2026-04-21
        to: 2026-04-22
        quality: VERIFIED
        evidence_ids: [tase-weekly-review-2026-04-20]
      - scope: SCHEDULED_CLOSURES
        from: 2026-04-23
        to: 2027-12-31
        quality: INCOMPLETE
        evidence_ids: [isa-trading-week-2026]

      # The vacation schedule proves which 2025 dates were shortened, but the preserved board
      # resolution was conditional on later ISA approval and does not prove an operative 14:30
      # close. No 2025 EARLY_CLOSE events are emitted until that effective notice is sourced.
      - scope: EARLY_CLOSES
        from: 2025-01-01
        to: 2026-01-08
        quality: INCOMPLETE
        evidence_ids: [tase-vacation-schedule-2025, tase-board-trading-hours-2024]
      # The ISA guide establishes the recurring 13:50 Friday close. Only the emitted Q1 Friday
      # dates are VERIFIED; intervening dates remain INCOMPLETE because the quarterly total does
      # not establish the absence of other shortened sessions.
      - scope: EARLY_CLOSES
