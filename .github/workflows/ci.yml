name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tools-path: ${{ steps.build.outputs.tools-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        id: build
        run: |
          ./gradlew build
          ./gradlew :tools:installDist
          echo "tools-path=tools/build/install/tools/bin/tools" >> $GITHUB_OUTPUT

      - name: Run tests
        run: ./gradlew test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The optional `mcp` extra (python/tests/test_mcp.py) requires the
          # official MCP SDK, which needs Python >=3.10; bdc-calendars itself
          # still supports 3.9+.
          python-version: '3.10'

      # Exercises the bdc-calendars package: its own API tests, the parity
      # fixtures dumped from the Java query API, a check that the data
      # bundled in python/bdc_calendars/data/ still re-derives from blessed/,
      # and (via the mcp extra) the bdc-calendars-mcp server.
      - name: Python package tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[test,mcp]"
          pytest python/ -q

      - name: Validate all calendars
        run: |
          set +e
          ./tools/build/install/tools/bin/tools validate --all --strict --format json > validate-result.json
          EXIT_CODE=$?
          set -e
          ./tools/build/install/tools/bin/tools validate --all --strict || true
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Calendar validation failed (exit $EXIT_CODE). See validate-result.json"
            exit $EXIT_CODE
          fi

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-result
          path: validate-result.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tools/build/reports/tests/

  calendar-diff:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    outputs:
      severity: ${{ steps.diff.outputs.severity }}
      has_changes: ${{ steps.diff.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build tools
        run: ./gradlew :tools:installDist

      - name: Run calendar diff
        id: diff
        run: |
          set +e
          ./tools/build/install/tools/bin/tools ci-diff \
            --blessed-dir blessed \
            --calendars all \
            --output-format json \
            --current-sha "${{ github.sha }}" > diff-result.json 2> diff-error.log
          EXIT_CODE=$?
          set -e

          # Parse results based on exit code
          if [ $EXIT_CODE -eq 0 ]; then
            echo "severity=NONE" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "severity=MINOR" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "severity=MAJOR" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "severity=ERROR" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "::error::Calendar diff failed with exit code $EXIT_CODE"
            echo "--- stderr ---"
            cat diff-error.log
            echo "--- stdout ---"
            cat diff-result.json
            exit 1
          fi

          # Generate markdown report (ignore exit code - we already captured severity above)
          ./tools/build/install/tools/bin/tools ci-diff \
            --blessed-dir blessed \
            --calendars all \
            --output-format markdown \
            --current-sha "${{ github.sha }}" > diff-report.md 2>> diff-error.log || true

          # Always show the report in the logs for visibility
          echo "::group::Calendar Diff Report"
          cat diff-report.md
          echo "::endgroup::"

      - name: Upload diff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calendar-diff
          path: |
            diff-result.json
            diff-report.md

      # Renders a browsable site for exactly the calendars the diff flagged, generated over each
      # one's blessed range so the comparison in `tools site --compare-to` lines up with the
      # blessed baseline rather than being swamped by "removed" rows for dates outside a narrower
      # window. Never deployed anywhere public — it is only ever handed back as a workflow
      # artifact, including for PRs from forks.
      - name: Generate site preview for changed calendars
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          set -e
          T=./tools/build/install/tools/bin/tools
          mkdir -p preview-generated

          CALENDAR_IDS=$(jq -r '.calendars | to_entries[] | select(.value.severity != "NONE") | .key' diff-result.json)
          if [ -z "$CALENDAR_IDS" ]; then
            echo "No changed calendars found in diff-result.json; nothing to preview"
          fi
          for ID in $CALENDAR_IDS; do
            RANGE_START=$(jq -r --arg id "$ID" '.calendars[$id].range_start' blessed/manifest.json)
            RANGE_END=$(jq -r --arg id "$ID" '.calendars[$id].range_end' blessed/manifest.json)
            echo "Generating $ID over $RANGE_START..$RANGE_END for the site preview"
            "$T" generate "$ID" --from "$RANGE_START" --to "$RANGE_END" \
              --out "preview-generated/$ID" --include-specs
          done

          "$T" site --blessed-dir preview-generated --compare-to blessed --out preview-site

      - name: Upload site preview artifact
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: preview-site
          retention-days: 14

      - name: Post PR comment
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('diff-report.md', 'utf8');

            // GitHub comment size limit is 65536 characters
            const MAX_SIZE = 60000;
            let truncated = false;

            if (report.length > MAX_SIZE) {
              truncated = true;
              // Find a good break point (end of a line)
              let cutoff = report.lastIndexOf('\n', MAX_SIZE);
              if (cutoff < MAX_SIZE * 0.8) cutoff = MAX_SIZE;
              report = report.substring(0, cutoff);
            }

            let body = report;
            if (truncated) {
              body += '\n\n---\n⚠️ **Report truncated due to size.** See the full report in the [workflow artifacts](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ').';
            }
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            body += '\n\n---\nPreview: download the `site-preview` artifact and run `tools serve --dir site-preview` — ' + runUrl;
            body += '\n\n---\n*Generated at: ' + new Date().toISOString() + '*';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## Calendar Diff Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  require-approval:
    runs-on: ubuntu-latest
    needs: calendar-diff
    if: needs.calendar-diff.outputs.has_changes == 'true'

    steps:
      - name: Check for approval label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            console.log(`Checking PR #${prNumber} for approval label`);

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            console.log(`Found labels: ${labels.map(l => l.name).join(', ')}`);

            const approvalLabel = labels.find(l => l.name === 'calendar-change-approved');
            const severity = '${{ needs.calendar-diff.outputs.severity }}';

            console.log(`Severity: ${severity}, Has approval label: ${!!approvalLabel}`);

            if (severity === 'MAJOR' && !approvalLabel) {
              core.setFailed(
                'MAJOR calendar changes detected. ' +
                'Add the "calendar-change-approved" label after reviewing the diff report.'
              );
            } else if (severity === 'MINOR' && !approvalLabel) {
              core.warning(
                'MINOR calendar changes detected (future events only). ' +
                'Consider adding the "calendar-change-approved" label.'
              );
              // Still fail for consistency - all calendar changes need approval
              core.setFailed(
                'MINOR calendar changes detected. ' +
                'Add the "calendar-change-approved" label to proceed.'
              );
            }

            console.log('Calendar change approved via label');
