name: Source review
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical source tables
        run: python3 scripts/sources.py --check
      - name: Report coverage expiry and evidence review age
        run: python3 scripts/verification/source_review.py
