name: Publish reviewed release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact full commit SHA containing a reviewed release descriptor
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publication
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin

jobs:
  build-once:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      commit: ${{ steps.gate.outputs.commit }}
      data_version: ${{ steps.gate.outputs.data_version }}
      python_version: ${{ steps.gate.outputs.python_version }}
      java_core_version: ${{ steps.gate.outputs.java_core_version }}
    steps:
      - name: Resolve exact CI-tested commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit }}
        run: |
          COMMIT="$TESTED_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then COMMIT="$MANUAL_SHA"; fi
          case "$COMMIT" in *[!0-9a-f]*|'') exit 2;; esac
          test "${#COMMIT}" -eq 40
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Prove CI succeeded for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          MATCHES=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT" -f status=completed | \
            jq --arg sha "$COMMIT" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')
          test "$MATCHES" -gt 0 || { echo "No successful CI run exists for exact commit $COMMIT" >&2; exit 1; }

      - name: Gate on a descriptor introduced by this exact commit
        id: gate
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          if ! git diff --name-only "${COMMIT}^" "$COMMIT" | grep -qx release/release.json; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$COMMIT" = "$(git rev-parse HEAD)"
          SOURCE_SHA=$(jq -er .source_sha release/release.json)
          git merge-base --is-ancestor "$SOURCE_SHA" "$COMMIT"
          BASELINE_REF=$(jq -er .baseline.ref release/release.json)
          test "$(git rev-parse "${BASELINE_REF}^{commit}")" = "$(jq -er .baseline.commit release/release.json)"
          python3 scripts/release/descriptor.py --verify
          test "$(jq -er .versions.data release/release.json)" = "$(jq -er .release_version.semantic blessed/manifest.json)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "data_version=$(jq -r .versions.data release/release.json)" >> "$GITHUB_OUTPUT"
          echo "python_version=$(jq -r .versions.python release/release.json)" >> "$GITHUB_OUTPUT"
          echo "java_core_version=$(jq -r .versions.java_core release/release.json)" >> "$GITHUB_OUTPUT"

      - name: Reuse a verified build from an earlier attempt
        if: steps.gate.outputs.release == 'true'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          URL=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="publication-$COMMIT" -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .archive_download_url // empty')
          if [ -z "$URL" ]; then
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p publication
          gh api "$URL" > "$RUNNER_TEMP/publication.zip"
          unzip -q "$RUNNER_TEMP/publication.zip" -d publication
          python3 scripts/release/verify_publication.py publication "$COMMIT"
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.release == 'true' && steps.reuse.outputs.reused == 'false'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.release == 'true' && steps.reuse.outputs.reused == 'false'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.release == 'true' && steps.reuse.outputs.reused == 'false'
        with:
          python-version: '3.11'

      - name: Validate and build all deliverables once
        if: steps.gate.outputs.release == 'true' && steps.reuse.outputs.reused == 'false'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${{ steps.resolve.outputs.commit }}")
          ./gradlew build :tools:installDist nmcpZipAggregation -Prelease=true
          tools/build/install/tools/bin/tools validate --all --strict
          tools/build/install/tools/bin/tools crossvalidate --all --out blessed
          git diff --exit-code -- blessed
          python3 scripts/release/descriptor.py --verify
          python3 python/scripts/sync_data.py --check
          python -m pip install --upgrade build
          python -m build python/
          tools/build/install/tools/bin/tools site \
            --out publication/pages \
            --base-url https://twallengren.github.io/calendar-project/ \
            --generated-at "$(jq -r .generation_timestamp release/release.json)"
          touch publication/pages/.nojekyll

      - name: Assemble deterministic release assets
        if: steps.gate.outputs.release == 'true' && steps.reuse.outputs.reused == 'false'
        run: |
          VERSION=$(jq -r .versions.data release/release.json)
          mkdir -p publication/dataset publication/assets publication/java publication/python publication/maven
          cp blessed/manifest.json publication/dataset/
          for ID in $(jq -r '.calendars | keys[]' blessed/manifest.json); do
            cp -R "blessed/$ID" publication/dataset/
          done
          cp -R sources publication/dataset/
          cp release/release.json release/impact.json release/baseline-evidence.json publication/dataset/
          jq --arg commit "${{ steps.resolve.outputs.commit }}" '.release_commit = $commit' \
            publication/dataset/release.json > publication/dataset/release.json.tmp
          mv publication/dataset/release.json.tmp publication/dataset/release.json
          cp core/build/libs/* data/build/libs/* publication/java/
          cp build/nmcp/zip/aggregation.zip publication/maven/central-bundle.zip
          cp python/dist/* publication/python/
          python3 scripts/release/archive.py publication/dataset "publication/assets/bdc-calendars-${VERSION}"
          for ID in $(jq -r '.calendars | keys[]' blessed/manifest.json); do
            cp "blessed/$ID/events.csv" "publication/assets/${ID}-events.csv"
            cp "blessed/$ID/events.json" "publication/assets/${ID}-events.json"
            ICS="publication/pages/v1/calendars/$ID/holidays-recent.ics"
            if [ -f "$ICS" ]; then cp "$ICS" "publication/assets/${ID}-holidays.ics"; fi
          done
          python3 scripts/release/checksums.py publication/assets publication/java publication/python publication/maven publication/pages > publication/checksums.txt

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.release == 'true'
        with:
          name: publication-${{ steps.resolve.outputs.commit }}
          path: publication
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  github-release:
    needs: build-once
    if: needs.build-once.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-once.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ needs.build-once.outputs.commit }}
          path: publication
      - name: Bind tag and assets to the exact commit, idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build-once.outputs.commit }}
          VERSION: ${{ needs.build-once.outputs.data_version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$COMMIT" || { echo "Conflicting tag $TAG" >&2; exit 1; }
          else
            git config user.name "calendar-release[bot]"
            git config user.email "calendar-release[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT" -m "Calendar data $VERSION"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            python3 scripts/release/verify_github_release.py "$TAG" publication
          else
            gh release create "$TAG" publication/assets/* publication/java/* publication/python/* publication/checksums.txt \
              --verify-tag --title "Calendar data v$VERSION" \
              --notes "Built from exact commit \`$COMMIT\`. See release/release.json for immutable inputs and hashes."
          fi

  publish-python:
    needs: [build-once, github-release]
    if: needs.build-once.outputs.release == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-once.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ needs.build-once.outputs.commit }}
          path: publication
      - name: Reject an existing version with different files
        run: python3 scripts/release/verify_pypi.py "${{ needs.build-once.outputs.python_version }}" publication/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publication/python
          skip-existing: true
      - name: Verify installation from PyPI
        run: |
          for ATTEMPT in $(seq 1 12); do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple "bdc-calendars==${{ needs.build-once.outputs.python_version }}"; then
              python -c 'import bdc_calendars; assert bdc_calendars.__version__ == "${{ needs.build-once.outputs.python_version }}"; assert bdc_calendars.data_version == "${{ needs.build-once.outputs.data_version }}"'
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish-maven:
    needs: [build-once, github-release]
    if: needs.build-once.outputs.release == 'true' && vars.MAVEN_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-once.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ needs.build-once.outputs.commit }}
          path: publication
      - name: Upload once and resume the recorded Central deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ needs.build-once.outputs.data_version }}
          COMMIT: ${{ needs.build-once.outputs.commit }}
        run: |
          TAG="v$VERSION"
          for ATTEMPT in $(seq 1 12); do
            set +e
            python3 scripts/release/prepare_maven_upload.py \
              publication/maven/central-bundle.zip publication/maven/upload.zip \
              --core-version "$(jq -r .versions.java_core release/release.json)" \
              --data-version "$VERSION" > publication/maven/plan.json
            PLAN_STATUS=$?
            set -e
            if [ "$PLAN_STATUS" -eq 0 ]; then break; fi
            if [ "$PLAN_STATUS" -ne 2 ]; then exit "$PLAN_STATUS"; fi
            sleep 10
          done
          test "$PLAN_STATUS" -eq 0
          if [ "$(jq -r .upload_required publication/maven/plan.json)" = false ]; then
            echo "All Maven coordinates exist with byte-identical files; skipping upload."
            ./gradlew -b scripts/release/maven-smoke.gradle.kts resolveRelease \
              --gradle-user-home "$RUNNER_TEMP/maven-smoke" --refresh-dependencies \
              -PcoreVersion="$(jq -r .versions.java_core release/release.json)" \
              -PdataVersion="$VERSION"
            exit 0
          fi
          BUNDLE_SHA=$(jq -r .bundle_sha256 publication/maven/plan.json)
          mkdir -p publication/maven-state
          if gh release download "$TAG" --pattern maven-deployment.json --dir publication/maven-state >/dev/null 2>&1; then
            test "$(jq -r .bundle_sha256 publication/maven-state/maven-deployment.json)" = "$BUNDLE_SHA"
            DEPLOYMENT_ID=$(jq -r .deployment_id publication/maven-state/maven-deployment.json)
          else
            AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
            DEPLOYMENT_ID=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $AUTH" \
              --form "bundle=@publication/maven/upload.zip;type=application/octet-stream" \
              "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=calendar-project-$COMMIT")
            jq -n --arg id "$DEPLOYMENT_ID" --arg sha "$BUNDLE_SHA" --arg commit "$COMMIT" \
              '{deployment_id:$id,bundle_sha256:$sha,commit:$commit}' > publication/maven-state/maven-deployment.json
            gh release upload "$TAG" publication/maven-state/maven-deployment.json
          fi
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          for ATTEMPT in $(seq 1 30); do
            STATE=$(curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")
            case "$(printf '%s' "$STATE" | jq -r .deploymentState)" in
              PUBLISHED)
                ./gradlew -b scripts/release/maven-smoke.gradle.kts resolveRelease \
                  --gradle-user-home "$RUNNER_TEMP/maven-smoke" --refresh-dependencies \
                  -PcoreVersion="$(jq -r .versions.java_core release/release.json)" \
                  -PdataVersion="$VERSION"
                exit 0
                ;;
              FAILED) printf '%s\n' "$STATE" >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "Central deployment $DEPLOYMENT_ID is still processing; retry this workflow to resume it." >&2
          exit 1

  deploy-pages:
    needs: [build-once, github-release]
    if: needs.build-once.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ needs.build-once.outputs.commit }}
          path: publication
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publication/pages
      - id: deployment
        uses: actions/deploy-pages@v4
