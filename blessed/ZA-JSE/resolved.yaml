    ref: "Wednesday, 8 May 2019 has been gazetted as an official voting day... As\
      \ a result, all JSE Markets will be closed"
  - id: jse-notice-481a-2021
    ref: "Monday, 1 November 2021 has been gazetted as an official voting day... all\
      \ JSE Markets will be closed"
  - id: jse-hotline-057-2024
    ref: "Wednesday, 29 May 2024 has been declared as an official public holiday...\
      \ all JSE Markets will be closed"
  - id: sanews-2026-09-15
    ref: "declared Wednesday, 4 November 2026 - the date for Local Government Elections\
      \ - as a public holiday throughout the country"
  rule:
    type: explicit_dates
    dates:
    - date: 2011-05-18
      comment: local government elections
    - date: 2014-05-07
      comment: national and provincial elections
    - date: 2016-08-03
      comment: local government elections
    - date: 2019-05-08
      comment: national and provincial elections
    - date: 2021-11-01
