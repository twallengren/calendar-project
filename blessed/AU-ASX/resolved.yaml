- key: au_asx_unscheduled_early_termination_2016
  name: Unscheduled Early Termination (ASX Trade outage)
  origin: module:au_asx_unscheduled_exceptions
  classification: EARLY_CLOSE
  close_time: 14:05
  status: CONFIRMED
  source:
  - id: asx-notice-1111-16-09
    ref: At 2.05pm ASX placed the entire market back into Enquire. ... At 3.35pm ASX
      announced that the market would not re-open and that there would be no CSPA.
  - id: asx-media-alert-2016-09-19
    ref: a delay to the market open and the decision to close the market early
  - id: asic-16-352mr
    ref: This caused a delay to the market opening and an early market close
  rule:
    type: explicit_dates
    dates:
    - date: 2016-09-19
      comment: "hardware failure in the main ASX Trade database; staggered open from\
        \ 11:30, closed 14:05 without a closing auction"
- key: au_asx_unscheduled_early_termination_2020
  name: Unscheduled Early Termination (ASX Trade outage)
  origin: module:au_asx_unscheduled_exceptions
  classification: EARLY_CLOSE
  close_time: 10:24
  status: CONFIRMED
  source:
  - id: asx-market-outage-report-2020-12-04
    ref: All markets on ASX Trade were placed in an ENQUIRE Session State at 10:24:05.
      They remained in ENQUIRE for the rest of the trading day until 18:50
  - id: asx-media-alert-2020-11-16
    ref: "The market will remain closed today, Monday 16 November. It will reopen\
      \ at the normal time (10am) tomorrow, Tuesday 17 November."
  - id: asx-notice-1469-20-11
    ref: All trades executed and reported today are valid
  rule:
    type: explicit_dates
    dates:
    - date: 2020-11-16
      comment: ASX Trade software fault in the opening auction; trading ceased at
        10:24:05 for the rest of the day
