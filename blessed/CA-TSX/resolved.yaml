kind: resolved_calendar
id: CA-TSX
metadata:
  name: Toronto Stock Exchange
  description: "Toronto Stock Exchange (TSX, MIC XTSE) trading calendar"
  chronology: ISO
  timezone: America/Toronto
  coverage:
    from: 2000-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
weekend_policy:
  days:
  - SATURDAY
  - SUNDAY
weekend_shift_policy: NEXT_AVAILABLE_WEEKDAY
resolution_chain:
- module:weekend_sat_sun
- module:ca_new_years_day
- module:ca_family_day
- module:ca_good_friday
- module:ca_victoria_day
- module:ca_canada_day
- module:ca_civic_holiday
- module:ca_labour_day
- module:ca_thanksgiving
- module:ca_christmas
- module:ca_boxing_day
- module:ca_tsx_holidays
- calendar:CA-TSX
references:
- key: easter
  formula: EASTER_WESTERN
event_sources:
- key: ca_new_years_day
  name: New Year's Day
  origin: module:ca_new_years_day
  classification: CLOSED
  shiftable: true
  status: CONFIRMED
  source:
  - id: holidays-act-canada
  - id: tmx-holiday-schedule-2021
    ref: "Sat Jan 1, 2022 observed Mon Jan 3, 2022"
  rule:
    type: fixed_month_day
    month: 1
    day: 1
