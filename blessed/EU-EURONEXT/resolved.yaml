kind: resolved_calendar
id: EU-EURONEXT
metadata:
  name: Euronext Cash Markets Base Calendar
  description: "Shared holiday calendar for the Euronext cash markets (Amsterdam,\
    \ Brussels, Lisbon, Paris)"
  chronology: ISO
  timezone: Europe/Paris
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
weekend_policy:
  days:
  - SATURDAY
  - SUNDAY
weekend_shift_policy: NONE
resolution_chain:
- module:weekend_sat_sun
- module:euronext_new_years_day
- module:euronext_good_friday
- module:euronext_easter_monday
- module:euronext_labour_day
- module:euronext_christmas
- module:euronext_boxing_day
- module:euronext_special_closures
- module:euronext_holidays
- calendar:EU-EURONEXT
references:
- key: easter
  formula: EASTER_WESTERN
event_sources:
