kind: resolved_calendar
id: US-MARKET-BASE
metadata:
  name: US Market Base Calendar
  description: Base calendar for US markets with core holidays
  chronology: ISO
  timezone: America/New_York
  coverage:
    from: 1900-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
weekend_policy:
  days:
  - SATURDAY
  - SUNDAY
weekend_shift_policy: NEAREST_WEEKDAY
resolution_chain:
- module:weekend_sat_sun
- module:new_years_day
- module:memorial_day
