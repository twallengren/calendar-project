kind: calendar
id: EU-TARGET
metadata:
  name: T2 euro RTGS
  description: "Euro-denominated T2 central liquidity management and real-time gross\
    \ settlement operating dates. This date-only calendar models whether the T2 RTGS\
    \ business date is open for customer and interbank payments; it does not represent\
    \ TIPS availability, limited liquidity-transfer windows, session times, cutoffs\
    \ or instrument eligibility. The ECB's current six TARGET closing days are applied\
    \ without substitute weekdays and are confirmed for 2026-2027."
