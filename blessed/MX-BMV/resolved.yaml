  shiftable: true
  close_time: 12:00
  status: CONFIRMED
  active_years:
  - - 2018
    - null
  source:
  - id: fund-compass-2018-12-18
    ref: el horario de la sesión de remate de la BMV y de BIVA del 24 de diciembre
      será de las 8:00 a las 12:00 horas
  - id: fund-hsbc-2025-12-09
    ref: cerrarán 3 horas antes respecto al horario habitual ... debido a que habrá
      un cambio en el horario de operaciones en la Bolsa Mexicana de Valores
  rule:
    type: fixed_month_day
    month: 12
    day: 24
- key: mx_bmv_earthquake_recess_2017
  name: Receso administrativo (sismo)
  origin: module:mx_bmv_unscheduled_exceptions
  classification: EARLY_CLOSE
  close_time: 13:43
  status: CONFIRMED
  source:
  - id: bmv-press-2017-09-20
    ref: "procedió a suspender operaciones decretando un receso administrativo que\
      \ inició a las 13:43 horas, manteniéndose hasta el cierre del Mercado"
  rule:
    type: explicit_dates
    dates:
    - date: 2017-09-19
      comment: earthquake at 13:14; administrative recess from 13:43 to the close
- key: mx_bmv_trading_engine_failure_2020
  name: Suspensión de la Sesión de Remate (falla del motor de negociación)
  origin: module:mx_bmv_unscheduled_exceptions
  classification: EARLY_CLOSE
  close_time: 11:56
  status: CONFIRMED
  source:
  - id: press-elceo-2020-10-09
    ref: "a las 11:56 hrs., se presentó una desconexión en el motor de negociació\
      n ... decretó la suspensión de la Sesión de Remate que se mantuvo hasta el cierre\
      \ de la jornada bursátil"
  rule:
    type: explicit_dates
    dates:
    - date: 2020-10-09
      comment: trading-engine disconnection at 11:56; the session was not resumed
