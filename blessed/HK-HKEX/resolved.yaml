kind: resolved_calendar
id: HK-HKEX
metadata:
  name: Hong Kong Exchanges and Clearing
  description: "Securities market of The Stock Exchange of Hong Kong Limited, operated\
    \ by Hong Kong Exchanges and Clearing Limited (MIC XHKG). Trading runs Monday\
    \ to Friday; the market is closed on every Hong Kong general holiday (General\
    \ Holidays Ordinance, Cap. 149) that falls on a weekday, and trades a morning\
    \ session only (12:00 noon close) on Christmas Eve, New Year's Eve and Lunar New\
    \ Year's Eve. Hong Kong observance: a general holiday falling on a Sunday is observed\
    \ on the following weekday; a general holiday falling on a Saturday is not substituted.\
    \ Lunar holidays retain CHINESE_HK native origins and Ching Ming uses a bounded\
    \ HKO reference table. Every resulting closure remains bounded to, and confirmed\
    \ against, the Government and exchange schedules through the last gazetted year\
    \ (2027); computed future dates are not published as confirmed holidays. Unscheduled\
    \ closures for typhoons and black rainstorms are out of scope: they are announced\
    \ on the day, are not part of any published schedule, and are not modelled here\
    \ (HKEX moved to trading through severe weather on 23 September 2024)."
  chronology: ISO
  timezone: Asia/Hong_Kong
  mic: XHKG
  coverage:
    from: 2018-01-01
    to: 2027-12-31
    verified_through: 2027-12-31
    quality:
    - scope: SCHEDULED_CLOSURES
      from: 2018-01-01
      to: 2027-12-31
      quality: VERIFIED
      evidence_ids:
      - hkex-calendar
      - hkex-calendar-archived
      - govhk-general-holidays
    - scope: EARLY_CLOSES
      from: 2018-01-01
      to: 2027-12-31
      quality: VERIFIED
      evidence_ids:
      - hkex-calendar
      - hkex-calendar-archived
      - hkex-securities-trading-hours
    - scope: UNSCHEDULED_EXCEPTIONS
      from: 2018-01-01
      to: 2024-09-22
      quality: INCOMPLETE
      evidence_ids:
      - hkex-severe-weather-notices
    - scope: UNSCHEDULED_EXCEPTIONS
      from: 2024-09-23
      to: 2027-12-31
      quality: PROJECTED
      evidence_ids:
      - hkex-severe-weather-trading
