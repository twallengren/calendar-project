  - za_human_rights_day
  - za_good_friday_family_day
  - za_freedom_day
  - za_workers_day
  - za_youth_day
  - za_national_womens_day
  - za_heritage_day
  - za_day_of_reconciliation
  - za_christmas_day
  - za_day_of_goodwill
  - za_one_off_public_holidays
  - za_jse_early_closes
