kind: module
id: za_jse_holidays

# JSE equity-market non-trading days: every South African public holiday (Public Holidays Act 36
# of 1994, Schedule 1, with the Sunday-to-Monday rule), the holidays declared by proclamation
# (election days, the Tuesday after a Sunday Christmas, 15 December 2023), and the 12:00 early
# closes on the two year-end days plus the 2019 go-live early close.

uses:
