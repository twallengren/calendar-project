id: sg_sgx_holidays

# SGX securities market (SGX-ST) non-trading days: every Singapore public holiday gazetted by the
# Ministry of Manpower ("SGX follows the Singapore holiday calendar available on the Ministry of
# Manpower website"), the one-off SG50 and Polling Day holidays, the half-day sessions on the
# eves of Chinese New Year, Christmas and New Year, and the 2016 market disruption.

uses:
