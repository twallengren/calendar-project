  - sg_vesak_day
  - sg_hari_raya_puasa
  - sg_hari_raya_haji
  - sg_national_day
  - sg_deepavali
  - sg_christmas_day
  - sg_one_off_public_holidays
  - sg_sgx_half_days
  - sg_sgx_unscheduled_exceptions
