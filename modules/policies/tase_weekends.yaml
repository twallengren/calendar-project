kind: module
id: tase_weekends

# TASE's own 2025 schedule states that trading runs Sunday-Thursday. TASE's vacation schedule page
# states "As of January 4th, 2026, the trading on TASE takes place Monday to Friday", so Sunday
# 4 January 2026 is the first non-trading Sunday (the ISA guide's "effective 5 January" is the
# first trading day of the new week; TASE's Q1 2026 count of 62 sessions reconciles only with
# 4 January closed). Friday 2 January 2026 is still a weekend day under the old week; the first
# Friday session is 9 January.
source:
  - id: tase-vacation-schedule-2025
    ref: "Opening statement: trading takes place Sunday through Thursday"
  - id: tase-trading-vacation-schedule
    ref: "As of January 4th, 2026, the trading on TASE takes place Monday to Friday"
  - id: isa-trading-week-2026
    ref: "pp. 7, 30: effective 2026-01-05; new trading days Monday through Friday"

policies:
  weekends:
    - {days: [FRIDAY, SATURDAY], to: 2026-01-03}
    - {days: [SATURDAY, SUNDAY], from: 2026-01-04}
