id: in_republic_day

# Republic Day: as dated in the exchange's annual trading-holiday circulars (Capital Market
# Segment), weekday occurrences only; the exchange never substitutes a weekday for a holiday that
# falls on a Saturday or Sunday. The circulars spell it: Republic Day.
# Source: nse-holiday-lists.

