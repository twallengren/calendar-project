kind: module
id: flag_day

# Flag Day (June 14). NYSE closed every year 1916-1953.
# Source: nyse-history-2008.

source:
  - id: nyse-history-2008
    ref: Flag Day

event_sources:
  - key: flag_day
    name: Flag Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    active_years:
      - [1916, 1953]
    rule:
      type: fixed_month_day
      month: 6
      day: 14
