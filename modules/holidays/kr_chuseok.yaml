kind: module
id: kr_chuseok

# Chuseok: the day before, the day of and the day after the harvest festival (lunar 8/14-8/16), as
# dated in the exchange's lists. From 2014 a Sunday overlap is substituted on the next non-holiday
# (10 September 2014, the first substitute holiday in Korea; 29 September 2015; 6 October 2017
# after the block overlapped National Foundation Day; 26 September 2018; 12 September 2022;
# 8 October 2025); Saturday overlaps bring none. 3 October 2017 is carried by
# kr_national_foundation_day, as the exchange names it.
# Source: krx-holidays.

