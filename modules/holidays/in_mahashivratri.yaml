kind: module
id: in_mahashivratri

# Mahashivratri: as dated in the exchange's annual trading-holiday circulars (Capital Market
# Segment), weekday occurrences only; the exchange never substitutes a weekday for a holiday that
# falls on a Saturday or Sunday. The circulars spell it: Mahashivratri.
# Source: nse-holiday-lists.

source:
  - id: nse-holiday-lists

event_sources:
  - key: in_mahashivratri
    name: "Mahashivratri"
    default_classification: CLOSED
    rule:
      type: explicit_dates
      dates:
