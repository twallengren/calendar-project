kind: module
id: tase_short_sessions_2025

# TASE's 2025 vacation schedule identifies both complete intermediate-holiday ranges as shortened
# sessions. Its 15 February 2024 board decision sets the equity-market end of trading for Passover
# and Sukkot intermediate days at 14:30. The spans are Hebrew-native; weekend dates in the Sukkot
# span are dropped by EARLY_CLOSE precedence rather than emitted as sessions.
source:
  - id: tase-vacation-schedule-2025
    ref: "Opening note: shortened trading 14-17 April and 8-12 October 2025"
  - id: tase-board-trading-hours-2024
    ref: "p. 17: Passover and Sukkot intermediate-day TAL stage ends at 14:30"

event_sources:
  - key: tase_passover_intermediate_2025
    name: Passover Intermediate Day (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "14:30"
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [NISAN]
      day: 16
      duration_days: 4
      native_years: [{start: 5785, end: 5785}]

  - key: tase_sukkot_intermediate_2025
    name: Sukkot Intermediate Day (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "14:30"
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [TISHRI]
      day: 16
      duration_days: 5
      native_years: [{start: 5786, end: 5786}]
