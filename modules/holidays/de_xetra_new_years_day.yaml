kind: module
id: de_xetra_new_years_day

# New Year's Day (January 1). Xetra: closed every year 2003-2026 when 1 January falls on a
# weekday; not shifted when it falls on a weekend. Source: sources/DE-XETRA/README.md
# (confirmed against every trading calendar 2003-2026).

source:
  - id: xetra-trading-calendar-2003
    ref: "exceptions sentence: 1 January"
  - id: xetra-trading-calendar-2026
    ref: "exceptions sentence: 1 January"

event_sources:
  - key: de_xetra_new_years_day
    name: New Year's Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 1
      day: 1
