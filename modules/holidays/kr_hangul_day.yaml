kind: module
id: kr_hangul_day

# Hangul Day (한글날, 9 October), re-designated a public holiday by the decree of 28 December 2012
# (first observed 2013). Substitutes from the 4 August 2021 amendment: Monday 11 October 2021,
# Monday 10 October 2022, Monday 11 October 2027.
# Source: krx-holidays (the exchange's own non-trading-day lists), moi-public-holidays-decree.

source:
  - id: krx-holidays

event_sources:
  - key: kr_hangul_day
    name: Hangul Day
    default_classification: CLOSED
    shift_policy: NONE
    active_years:
      - [2013, null]
    rule:
      type: fixed_month_day
      month: 10
      day: 9

  - key: kr_hangul_day_substitute
    name: Hangul Day (substitute holiday)
    default_classification: CLOSED
    rule:
      type: explicit_dates
      dates:
        - 2021-10-11
        - 2022-10-10
        - 2027-10-11
