kind: module
id: kr_memorial_day

# Memorial Day (현충일, 6 June). Never receives a substitute day (art. 3 excludes art. 2 no. 8).
# Source: krx-holidays (the exchange's own non-trading-day lists), moi-public-holidays-decree.

source:
  - id: krx-holidays

event_sources:
  - key: kr_memorial_day
    name: Memorial Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 6
      day: 6
