kind: module
id: tw_lunar_new_year

# Lunar New Year as the exchange's annual tables list it. The public holidays run from the Eve
# (除夕; from 2025 the day before it, 小年夜, under the 紀念日及節日實施條例) through the third day,
# with weekend days made up on the following working days and bridge days (調整放假) attached in
# several years; and the exchange stops trading two business days earlier, keeping those two
# days for clearing and settlement only ("市場無交易，僅辦理結算交割作業"), so they are
# non-trading days too. Each year's dates are read from the exchange's table and confirmed by its
# daily market summary. 2027 follows the government's 116年 calendar with the two settlement-only
# days projected from the unbroken 2010-2026 pattern.
# Source: twse-holiday-schedules, twse-trading-days.

