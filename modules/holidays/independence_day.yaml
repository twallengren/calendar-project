kind: module
id: independence_day

# Independence Day (July 4). NYSE: closed every year.
# Observance: Sunday -> Monday throughout. Saturday -> preceding Friday since NYSE Rule 51,
# adopted July 3, 1959 (the first application: Friday July 3, 1959). Earlier Friday or Saturday
# closings around July 4 are listed in us_nyse_special_closings_pre1960.
# Source: nyse-history-2008.

source:
  - id: nyse-history-2008
    ref: "Independence Day; Rule 51 note"

event_sources:
  - key: independence_day
    name: Independence Day
    default_classification: CLOSED
    shift_policy: NEAREST_WEEKDAY
    active_years:
      - [1959, null]
    rule:
      type: fixed_month_day
      month: 7
      day: 4

  - key: independence_day_pre1959
    name: Independence Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    active_years:
      - [null, 1958]
    rule:
      type: fixed_month_day
      month: 7
      day: 4
