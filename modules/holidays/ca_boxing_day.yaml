kind: module
id: ca_boxing_day

# Boxing Day, December 26. Not in the federal Holidays Act, but a statutory holiday under
# the Ontario Employment Standards Act, and part of TSX's published schedule every year
# (tsx-calendar-page shows "In Lieu of Boxing Day" for Dec 28, 2026, since Dec 26, 2026 is a
# Saturday). Shifts to the next available weekday when it falls on a weekend, cascading past
# Christmas Day's own shifted date: tmx-holiday-schedule-2021 confirms Sun Dec 26, 2021
# (nominal) was observed Tue Dec 28, 2021, one day after Christmas's own Sat->Mon shift.
#
# In the other direction, ca_christmas declares `displaces: [ca_boxing_day]`: when Dec 25 is a
# Sunday, Boxing Day's own nominal Monday is taken by Christmas "in lieu of Christmas Day" and
# Boxing Day re-cascades to the Tuesday "in lieu of Boxing Day" (tmx-holiday-schedule-2016).
# See modules/holidays/ca_christmas.yaml and spec/SPEC.md, "Observance priority".

source:
  - id: tsx-calendar-page
    ref: "In Lieu of Boxing Day: Dec 28, 2026"
  - id: tmx-holiday-schedule-2021
    ref: "Boxing Day (nominal Sun Dec 26, 2021) observed Tue Dec 28, 2021"

event_sources:
  - key: ca_boxing_day
    name: Boxing Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 12
      day: 26
