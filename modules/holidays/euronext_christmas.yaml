kind: module
id: euronext_christmas

# Christmas Day (25 December) on the Euronext cash markets.
#
# Not observed when it falls on a weekend: 25 December 2010 (Sat), 2011 (Sun), 2016 (Sun),
# 2021 (Sat) and 2022 (Sun) are absent from the yearly Euronext calendars. In 2022 the calendar
# explicitly lists "Tuesday 27 December 2022 (Substitute for Christmas Day)" as a full trading
# day for Amsterdam, Brussels, Lisbon and Paris (only Dublin closed). Hence shift_policy: NONE.

source:
  - id: euronext-hours-holidays
    ref: "Calendar of business days, yearly tables"

event_sources:
  - key: euronext_christmas
    name: Christmas Day
    default_classification: CLOSED
    shiftable: false
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 12
      day: 25
