kind: module
id: br_new_years_day

# New Year's Day (Confraternização Universal, 1 January), a national holiday (Lei 662/1949).
# Brazil has no weekend substitution: a holiday on a Saturday or Sunday is simply not a trading
# closure (the exchange's tables list such days with no replacement), hence shift_policy NONE.

# Source: br-lei-662-1949, b3-calendars (the exchange's annual holiday circulars).

source:
  - id: br-lei-662-1949

event_sources:
  - key: br_new_years_day
    name: Confraternização Universal
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 1
      day: 1
