kind: module
id: in_maharashtra_day

# Maharashtra Day: as dated in the exchange's annual trading-holiday circulars (Capital Market
# Segment), weekday occurrences only; the exchange never substitutes a weekday for a holiday that
# falls on a Saturday or Sunday. The circulars spell it: Maharashtra Day; May Day.
# Source: nse-holiday-lists.

source:
  - id: nse-holiday-lists

event_sources:
