kind: module
id: au_boxing_day

# Boxing Day (26 December). When it falls on a Saturday the following Monday (28 December) is
# an additional public holiday; on a Sunday, the Tuesday (28 December) because the Monday is
# Christmas Day's substitute (Public Holidays Act 2010 (NSW) s 4(2)(f)-(g)). Cascades with
# au_christmas_day under NEXT_AVAILABLE_WEEKDAY: 2015, 2020 and 2026 close Fri 25 and Mon 28
# December.
# Source: nsw-public-holidays-act, asx-trading-calendars.

source:
  - id: nsw-public-holidays-act

event_sources:
  - key: au_boxing_day
    name: Boxing Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 12
      day: 26
