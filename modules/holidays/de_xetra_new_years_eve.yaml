kind: module
id: de_xetra_new_years_eve

# New Year's Eve (December 31). Xetra: a full non-trading day (not an early close) every year
# 2003-2026 when 31 December falls on a weekday; not shifted when it falls on a weekend. From
# 2008 the trading calendar PDFs separately flag this date as a "settlement day"; that
# distinction does not change whether the market is a business day and is not modelled. Source:
# sources/DE-XETRA/README.md.

source:
  - id: xetra-trading-calendar-2003
    ref: "exceptions sentence: 31 December"
  - id: xetra-trading-calendar-2026
    ref: "exceptions sentence: 31 December (settlement day)"

event_sources:
  - key: de_xetra_new_years_eve
    name: New Year's Eve
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 12
      day: 31
