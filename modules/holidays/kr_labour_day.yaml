kind: module
id: kr_labour_day

# Labour Day (근로자의 날, 1 May). Not a public holiday before 2026 but a KRX non-trading day under
# the exchange's own rule (유가증권시장 업무규정 제5조: "노동절 제정에 관한 법률에 따른 노동절"), so a
# weekend 1 May (2010, 2011, 2016, 2021, 2022) brought no closure and no substitute. From
# 1 May 2026 it is the public holiday 노동절 (대통령령 제36290호) and substitutes: Monday 3 May 2027
# per the exchange's 2027 list.
# Source: krx-holidays (the exchange's own non-trading-day lists), moi-public-holidays-decree.

source:
  - id: krx-holidays

event_sources:
  - key: kr_labour_day
    name: Labour Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 5
      day: 1

  - key: kr_labour_day_substitute
    name: Labour Day (substitute holiday)
    default_classification: CLOSED
    rule:
      type: explicit_dates
      dates:
        - 2027-05-03
