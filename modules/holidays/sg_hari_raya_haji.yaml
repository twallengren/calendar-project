# Hari Raya Haji (Eid al-Adha), dated each year by the Ministry of Manpower from MUIS. Sunday
# occurrences move to Monday (7 November 2011, 6 October 2014, 12 August 2019, 11 July 2022);
# Saturday occurrences (7 June 2025) bring no substitute. 2022 was revised from Saturday 9 July
# to Sunday 10 July (MOM, 21 October 2021).
# Source: mom-public-holidays and the per-year MOM lists.

