kind: module
id: hk_ching_ming

# Ching Ming Festival. A Hong Kong general holiday (General Holidays Ordinance, Cap. 149,
# Schedule). QINGMING_HK is a bounded table of the HKO's published Bright & Clear solar-term date,
# not an astronomical approximation. The rule uses the exchange-evidenced 2018-2027 part of that
# table and applies Hong Kong's Sunday-only substitution.

source:
  - id: govhk-general-holidays
  - id: hkex-calendar
  - id: hko-gregorian-lunar-conversion

references:
  - key: ching_ming_hko
    formula: QINGMING_HK

event_sources:
  - key: hk_ching_ming
    name: Ching Ming Festival
    default_classification: CLOSED
    shiftable: true
    shift_policy: FORWARD_ONLY
    active_years: [[2018, 2027]]
    status: CONFIRMED
    rule:
      type: relative_to_reference
      reference: ching_ming_hko
      offset_days: 0
