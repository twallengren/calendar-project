id: eid_al_adha

# Eid al-Adha closures of the Saudi Exchange (Tadawul).
#
# 2021-2029: explicit dates from the Saudi Exchange's published holiday announcements, status
# CONFIRMED. 2030 onward: PROJECTED from the Umm al-Qura calendar; the announced closures
# consistently run from about 5 Dhu al-Hijjah (a few days before Arafat Day on the 9th) through
# 13 Dhu al-Hijjah, so that span is projected.
# Source: saudi-exchange-announcements. See sources/SA-TADAWUL/README.md.

