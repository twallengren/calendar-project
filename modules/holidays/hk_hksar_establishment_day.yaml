kind: module
id: hk_hksar_establishment_day

# Hong Kong Special Administrative Region Establishment Day (1 July). A Hong Kong general holiday
# (General Holidays Ordinance, Cap. 149, Schedule). Sunday -> following Monday ("the day
# following ... Establishment Day", 2 July 2018); a Saturday 1 July is not substituted
# (2023), so FORWARD_ONLY is exact.
# Source: govhk-general-holidays / govhk-general-holidays-archived (gazetted dates),
# hkex-calendar (market closed).

source:
  - id: govhk-general-holidays
  - id: hkex-calendar

event_sources:
  - key: hk_hksar_establishment_day
    name: Hong Kong Special Administrative Region Establishment Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    rule:
      type: fixed_month_day
      month: 7
      day: 1
