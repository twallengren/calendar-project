kind: module
id: tase_verified_events_2026

# The two April 2026 civil closures were the first 2026 dates confirmed by a TASE publication (the
# 20 April weekly review); TASE's full vacation schedule page now corroborates them. The remaining
# 2026-2028 closures and every shortened session are in tase_scheduled_closures_2026_2028 and
# tase_shortened_sessions.

event_sources:
  - key: tase_memorial_day_2026
    name: Memorial Day
    shiftable: false
    source:
      - id: tase-weekly-review-2026-04-20
        ref: "p. 1: no Tuesday trading due to Memorial Day"
      - id: tase-trading-vacation-schedule
        ref: "Apr-21 Tuesday Memorial Day, Non-trading day"
    rule:
      type: native_explicit_dates
      dates:
        - {chronology_id: HEBREW, year: 5786, month_code: IYAR, day: 4}

  - key: tase_independence_day_2026
    name: Independence Day
    shiftable: false
    source:
      - id: tase-weekly-review-2026-04-20
        ref: "p. 1: no Wednesday trading due to Independence Day; resumes Thursday"
      - id: tase-trading-vacation-schedule
        ref: "Apr-22 Wednesday Independence Day, Non-trading day"
    rule:
      type: native_explicit_dates
      dates:
        - {chronology_id: HEBREW, year: 5786, month_code: IYAR, day: 5}
