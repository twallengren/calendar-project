kind: module
id: eid_al_fitr

# Eid al-Fitr closures of the Saudi Exchange (Tadawul).
#
# 2020-2029: explicit dates from the Saudi Exchange's published holiday announcements
# ("Trading will discontinue at the end of trading day X. Trading will resume on Y."), status
# CONFIRMED. The exchange publishes several years ahead according to the Umm al-Qura calendar.
# 2030 onward: PROJECTED from the Umm al-Qura calendar. The announced closures consistently run
# from about 28 Ramadan through 4 Shawwal, so that span is projected (weekend days included, as
# the exchange announces them).
# Source: saudi-exchange-announcements. See sources/SA-TADAWUL/README.md.

source:
  - id: saudi-exchange-announcements

event_sources:
  - key: eid_al_fitr
    name: Eid al-Fitr
    default_classification: CLOSED
    shiftable: false
    status: CONFIRMED
    rule:
