kind: module
id: eid_al_fitr

# Eid al-Fitr holiday (Shawwal 1-6 in Umm al-Qura calendar)
# The Saudi Exchange typically closes for 6 days around Eid al-Fitr.
# Dates are defined in the Umm al-Qura chronology and are not shifted for weekends.
event_sources:
