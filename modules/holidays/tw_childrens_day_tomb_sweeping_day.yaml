# Children's Day (兒童節, 4 April; a holiday again from 2011) and Tomb-Sweeping Day (民族掃墓節,
# the solar term 清明, 4 or 5 April) as the exchange's tables list them. When the two coincide the
# preceding day is a holiday, or the following day if that would be a Thursday (2013, 2016);
# weekend occurrences are made up from 2015 (2015, 2020, 2021, 2026, 2027); Friday 6 April 2018
# and Monday 3 April 2023 were bridge days.
# Source: twse-holiday-schedules.

