kind: module
id: saudi_national_day

# Saudi National Day (September 23).
# When Sep 23 falls on a weekend (Fri/Sat), the exchange observes it on the
# nearest working day via the calendar's NEAREST_WEEKDAY shift policy.
# Source: Saudi Exchange holiday calendar
event_sources:
  - key: saudi_national_day
    name: Saudi National Day
    default_classification: CLOSED
    shiftable: true
    rule:
      type: fixed_month_day
      key: saudi_national_day
      name: Saudi National Day
      month: 9
      day: 23
