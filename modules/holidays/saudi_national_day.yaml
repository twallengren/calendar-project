kind: module
id: saudi_national_day

# Saudi National Day (September 23).
# When it falls on a weekend day the exchange observes it on the nearest working day
# (Friday Sep 23, 2022 was observed Thursday Sep 22; Saturday Sep 23, 2023 on Sunday Sep 24).
# Source: saudi-exchange-announcements.

source:
  - id: saudi-exchange-announcements

event_sources:
  - key: saudi_national_day
    name: Saudi National Day
    default_classification: CLOSED
    shift_policy: NEAREST_WEEKDAY
    rule:
      type: fixed_month_day
      month: 9
      day: 23
