kind: module
id: au_australia_day

# Australia Day (26 January). Observed on the day itself since 1994; when it falls on a
# Saturday or Sunday the following Monday is the public holiday (Public Holidays Act 2010 (NSW)
# s 4(2)(b) and the earlier NSW proclamations): Mon 28 Jan 2013, 2019 and 2030; Mon 27 Jan
# 2014, 2020 and 2025. NEXT_AVAILABLE_WEEKDAY reproduces this.
# Source: nsw-public-holidays-act, asx-trading-calendars.

source:
  - id: nsw-public-holidays-act

event_sources:
  - key: au_australia_day
    name: Australia Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 1
      day: 26
