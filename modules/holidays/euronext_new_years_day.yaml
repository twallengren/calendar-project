kind: module
id: euronext_new_years_day

# New Year's Day (1 January) on the Euronext cash markets (Amsterdam, Brussels, Lisbon, Paris).
#
# Euronext does not observe a weekend holiday on a neighbouring weekday: 1 January 2011 (Sat),
# 2012 (Sun), 2017 (Sun) and 2022 (Sat) are absent from the yearly calendars, and the Monday
# after was a full trading day for these four venues (only Euronext Dublin closed). Hence
# shift_policy: NONE.

source:
  - id: euronext-hours-holidays
    ref: "Calendar of business days, yearly tables"

event_sources:
  - key: euronext_new_years_day
    name: New Year's Day
    default_classification: CLOSED
    shiftable: false
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 1
      day: 1
