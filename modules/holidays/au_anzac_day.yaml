kind: module
id: au_anzac_day

# ANZAC Day (25 April). ASX Trade is closed on 25 April itself and, since the Public Holidays
# Act 2010 (NSW) commenced on 1 January 2011, a Saturday or Sunday ANZAC Day gets no substitute
# trading-day closure: the exchange traded on Mon 27 Apr 2015 and Mon 27 Apr 2020 (20 trading
# days in each April per asx-activity-report-2015-04 and -2020-04), Mon 26 Apr 2021 ("State
# legislation has since confirmed Monday 26 April 2021 will not be gazetted in NSW for ANZAC
# Day", asx-notice-0812-18-07; 20 days, asx-activity-report-2021-04), and - although NSW
# declared additional public holidays on Mon 27 Apr 2026 and Mon 26 Apr 2027 (nsw-public-holidays-page,
# asx-notice-0217-26-02) - the exchange stayed open: the 2026 ASX Trade calendar lists no 27 April
# row and April 2026 had 20 trading days (asx-activity-report-2026-04); the 2027 calendar prints
# "ANZAC Day Monday 26 April OPEN - Substitute for Sunday 25 April" (asx-trade-calendar-2026-2027).
# The weekend date itself is still a closed (weekend) day, hence shift_policy NONE.
#
# Two additional closures inside this coverage are explicit:
#   - Mon 26 Apr 2010: ANZAC Day fell on a Sunday and NSW proclaimed the Monday an additional
#     public holiday under the pre-2011 regime; April 2010 had 19 trading days (22 weekdays less
#     Good Friday, Easter Monday and this day; asx-activity-report-2011-04, comparative column).
#   - Tue 26 Apr 2011: ANZAC Day coincided with Easter Monday and NSW gazetted the Tuesday as an
#     additional public holiday; April 2011 had 18 trading days (asx-activity-report-2011-04).
#     25 April 2011 itself is emitted once, as Easter Monday (au_easter_monday), so the fixed
#     rule skips 2011.
# QuantLib's Australia(ASX) calendar has neither additional day (allowlisted).

source:
  - id: nsw-public-holidays-page
    ref: "The Anzac Day holiday is always recognised and observed on the 25 April every year. This includes when it falls on a weekend."

event_sources:
  - key: au_anzac_day
    name: ANZAC Day
    default_classification: CLOSED
    shift_policy: NONE
    active_years:
      - [2010, 2010]
      - [2012, null]
    source:
      - id: asx-trade-calendar-2020
        ref: "ANZAC Day Saturday 25 April CLOSED (no Monday entry)"
      - id: asx-trade-calendar-2026-2027
        ref: "ANZAC Day Monday 26 April OPEN - Substitute for Sunday 25 April (2027)"
    rule:
      type: fixed_month_day
      month: 4
      day: 25

  - key: au_anzac_day_substitute
    name: ANZAC Day (additional public holiday)
    default_classification: CLOSED
    source:
      - id: asx-activity-report-2011-04
        ref: "Total trading days: April 2011 18, April 2010 19"
    rule:
      type: explicit_dates
      dates:
        - date: 2010-04-26
          comment: ANZAC Day fell on Sunday 25 April 2010
        - date: 2011-04-26
          comment: ANZAC Day fell on Easter Monday 25 April 2011
