kind: module
id: au_christmas_day

# Christmas Day (25 December). When it falls on a Saturday the following Monday (27 December)
# is an additional public holiday; when it falls on a Sunday the additional holiday is the
# Tuesday (27 December), because Boxing Day already occupies the Monday (Public Holidays Act 2010
# (NSW) s 4(2)(d)-(e) and the earlier proclamations). The calendar's NEXT_AVAILABLE_WEEKDAY policy
# cascades with au_boxing_day to produce exactly this: 2010, 2021 and 2027 close Mon 27 and Tue 28
# December; 2011, 2016 and 2022 close Mon 26 and Tue 27 December.
# Source: nsw-public-holidays-act, asx-trading-calendars.

source:
  - id: nsw-public-holidays-act

event_sources:
  - key: au_christmas_day
    name: Christmas Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 12
      day: 25
