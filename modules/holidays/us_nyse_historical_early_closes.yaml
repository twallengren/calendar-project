kind: module
id: us_nyse_historical_early_closes

# One-off early closes of the New York Stock Exchange that no recurring rule produces, with the
# local close time. Regular Christmas Eve, day-after-Thanksgiving and Independence-Day-eve early
# closes live in their own modules.
#
# Source: nyse-history-2008 (special closings list, "Closed at ..." entries). Late opens listed
# in the same document ("Opened at ...") are not modelled.

source:
  - id: nyse-history-2008
    ref: special closings list, "Closed at" entries

event_sources:
