kind: module
id: jp_jpx_market_holidays

# JPX-specific closures that are not national holidays: December 31 and January 2-3.
#
# "JPX markets are closed on Saturdays, Sundays, national holidays, and on the dates indicated
# below" - the dates indicated are Jan. 2, Jan. 3 and Dec. 31 in every edition of the page from
# 2019 through 2027. JPX lists them even when they fall on a weekend; here they are restricted to
# Monday-Friday so that a weekend year-end date produces the calendar's ordinary WEEKEND row
# instead of a second kind of closure row. The set of non-trading days is the same either way.

source:
  - id: jpx-market-holidays
    ref: "Jan. 2 / Jan. 3 / Dec. 31 \"Market Holiday\""

event_sources:
  - key: jp_jpx_new_year_market_holiday
    name: Market Holiday (New Year)
    default_classification: CLOSED
    shift_policy: NONE
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    rule:
      type: fixed_month_day
      month: 1
      day: 2
      end_month: 1
      end_day: 3

  - key: jp_jpx_year_end_market_holiday
    name: Market Holiday (year end)
    default_classification: CLOSED
    shift_policy: NONE
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    rule:
      type: fixed_month_day
      month: 12
      day: 31
