kind: module
id: tw_twse_typhoon_closures

# Full-day closures of the centralised market for typhoons. The exchange's rule (天然災害停止上班之
# 處理): when the Taipei City Government announces that all public offices in the city stop work
# for the day or the morning, the market closes for the whole day; an afternoon-only suspension
# keeps the market open and cancels post-close trading; settlement due that day is postponed.
# Each date is a full-day Taipei suspension in the city's register (taipei-suspension-register),
# is absent from the exchange's daily market summary (twse-trading-days), and was announced by the
# exchange (press quoting it, cited in the register). Afternoon-only suspensions on 12 June 2012,
# 12 July 2013 and 10 July 2018 left the session intact.
# Source: taipei-suspension-register.

source:
  - id: taipei-suspension-register

event_sources:
  - key: tw_twse_typhoon_closures
    name: Typhoon Closure
    default_classification: CLOSED
