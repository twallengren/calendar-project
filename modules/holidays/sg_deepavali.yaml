id: sg_deepavali

# Deepavali, dated each year by the Ministry of Manpower from the Hindu Endowments Board. Sunday
# occurrences move to Monday (28 October 2019, 13 November 2023, 9 November 2026); Saturday
# occurrences (2 November 2013, 29 October 2016, 14 November 2020) bring no substitute. 2013 was
# revised from Sunday 3 November to Saturday 2 November, so Monday 4 November 2013 was a trading
# day (SGX 2013 table: "4 November 2013 (Monday) will not be a public holiday"); 2014 was
# revised from 23 to 22 October.
# Source: mom-public-holidays and the per-year MOM lists.

source:
