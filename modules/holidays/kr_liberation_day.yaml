kind: module
id: kr_liberation_day

# Liberation Day (광복절, 15 August), a national day. Substitutes from the 4 August 2021 amendment,
# first applied on Monday 16 August 2021; then Monday 17 August 2026 and Monday 16 August 2027.
# Source: krx-holidays (the exchange's own non-trading-day lists), moi-public-holidays-decree.

source:
  - id: krx-holidays

event_sources:
  - key: kr_liberation_day
    name: Liberation Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 8
      day: 15

  - key: kr_liberation_day_substitute
    name: Liberation Day (substitute holiday)
    default_classification: CLOSED
    rule:
      type: explicit_dates
      dates:
        - 2021-08-16
        - 2026-08-17
        - 2027-08-16
