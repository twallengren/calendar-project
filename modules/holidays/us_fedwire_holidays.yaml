kind: module
id: us_fedwire_holidays

# Federal Reserve Banks' 2026-2027 holiday schedule. FORWARD_ONLY implements the schedule's exact
# weekend rule: the preceding Friday remains open for a Saturday holiday, while a Sunday holiday
# closes the following Monday.

source:
  - id: frfs-fedwire-operating-hours
  - id: frfs-holiday-schedule

event_sources:
  - key: fedwire_new_years_day
    name: New Year's Day
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: fixed_month_day, month: 1, day: 1}

  - key: fedwire_martin_luther_king_jr_day
    name: Martin Luther King Jr. Day
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: nth_weekday_of_month, month: 1, weekday: MONDAY, nth: 3}

  - key: fedwire_washingtons_birthday
    name: Washington's Birthday (Presidents Day)
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: nth_weekday_of_month, month: 2, weekday: MONDAY, nth: 3}

  - key: fedwire_memorial_day
    name: Memorial Day
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: nth_weekday_of_month, month: 5, weekday: MONDAY, nth: -1}

  - key: fedwire_juneteenth
    name: Juneteenth National Independence Day
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: fixed_month_day, month: 6, day: 19}

  - key: fedwire_independence_day
    name: Independence Day
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: fixed_month_day, month: 7, day: 4}

  - key: fedwire_labor_day
    name: Labor Day
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: nth_weekday_of_month, month: 9, weekday: MONDAY, nth: 1}

  - key: fedwire_columbus_day
    name: Columbus Day
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: nth_weekday_of_month, month: 10, weekday: MONDAY, nth: 2}

  - key: fedwire_veterans_day
    name: Veterans Day
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule: {type: fixed_month_day, month: 11, day: 11}

  - key: fedwire_thanksgiving_day
    name: Thanksgiving Day
    shiftable: false
