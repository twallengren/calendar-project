kind: module
id: saudi_founding_day

# Saudi Founding Day (February 22), established by Royal Decree in 2022.
# When Feb 22 falls on a weekend (Fri/Sat), the exchange observes it on the
# nearest working day.  Historical dates are from official Saudi Exchange
# announcements; future dates use the statutory Feb 22 as a projection.
# Source: Saudi Exchange holiday calendar
event_sources:
  # Historical observed dates from Saudi Exchange announcements
  - key: saudi_founding_day_historical
    name: Saudi Founding Day
    default_classification: CLOSED
    shiftable: false
    rule:
      type: explicit_dates
      key: saudi_founding_day_historical
      name: Saudi Founding Day
      dates:
        - {date: "2022-02-22"}
        - {date: "2023-02-22"}
        - {date: "2024-02-22"}
        # 2025: Feb 22 is Saturday (weekend); observed Sunday Feb 23
        - {date: "2025-02-23"}
        - {date: "2026-02-22"}
  # Future projected (statutory date; may shift if it falls on Fri/Sat)
  - key: saudi_founding_day_projected
    name: Saudi Founding Day
    default_classification: CLOSED
    shiftable: false
    active_years:
      - [2027, null]
    rule:
      type: fixed_month_day
      key: saudi_founding_day_projected
      name: Saudi Founding Day
      month: 2
      day: 22
