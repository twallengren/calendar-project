kind: module
id: saudi_founding_day

# Saudi Founding Day (February 22), established by Royal Decree in January 2022.
# When it falls on a weekend day the exchange observes it on the nearest working day
# (Saturday Feb 22, 2025 was observed on Sunday Feb 23, 2025).
# Source: saudi-exchange-announcements.

source:
  - id: saudi-exchange-announcements

event_sources:
  - key: saudi_founding_day
    name: Saudi Founding Day
    default_classification: CLOSED
    shift_policy: NEAREST_WEEKDAY
    active_years:
      - [2022, null]
    rule:
      type: fixed_month_day
      month: 2
      day: 22
