kind: module
id: christmas_eve

# Christmas Eve early close (December 24), NYSE.
# Regular early closes began in 1990 at 2:00 pm and moved to 1:00 pm in 1993. The early close
# applies Monday-Thursday only: when Christmas falls on a Saturday, Friday December 24 is the
# observed full holiday. Earlier one-off Christmas Eve closings (1951 at 1:00 pm, 1974 at
# 2:00 pm) are in us_nyse_historical_early_closes.
# Source: nyse-history-2008 (special closings 1990-2007), nyse-hours (2008 onward).

source:
  - id: nyse-history-2008
    ref: special closings 1990-2007
  - id: nyse-hours

event_sources:
  - key: christmas_eve_2pm
    name: Christmas Eve (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "14:00"
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY]
    active_years:
      - [1990, 1992]
    rule:
      type: fixed_month_day
      month: 12
      day: 24

  - key: christmas_eve
    name: Christmas Eve (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "13:00"
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY]
    active_years:
      - [1993, null]
    rule:
      type: fixed_month_day
      month: 12
      day: 24
