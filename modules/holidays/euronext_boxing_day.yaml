kind: module
id: euronext_boxing_day

# Boxing Day / St Stephen's Day (26 December) on the Euronext cash markets.
#
# Not observed when it falls on a weekend: 26 December 2010 (Sun), 2015 (Sat), 2020 (Sat),
# 2021 (Sun) and 2026 (Sat) are absent from the yearly Euronext calendars. The 2026 calendar
# lists "Monday 28 December 2026 (Substitute for St Stephen's Day / Boxing Day)" as a full
# trading day for Amsterdam, Brussels, Lisbon and Paris (only Dublin closed).
# Hence shift_policy: NONE.

source:
  - id: euronext-hours-holidays
    ref: "Calendar of business days, yearly tables"

event_sources:
  - key: euronext_boxing_day
    name: Boxing Day
    default_classification: CLOSED
    shiftable: false
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 12
      day: 26
