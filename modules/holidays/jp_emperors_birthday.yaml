kind: module
id: jp_emperors_birthday

# 天皇誕生日 (Tenno Tanjobi). The date follows the reigning Emperor:
#   - December 23 for Emperor Akihito, 1989-2018 (in coverage: 2010-2018)
#   - no Emperor's Birthday in 2019, the year of the abdication and accession
#   - February 23 for Emperor Naruhito, from 2020
# cao-shukujitsu confirms the gap: it lists no 天皇誕生日 in 2019.

source:
  - id: cao-shukujitsu
    ref: "天皇誕生日 rows, 2010-2027"

event_sources:
  - key: jp_emperors_birthday_akihito
    name: Emperor's Birthday
    default_classification: CLOSED
    active_years:
      - [null, 2018]
    rule:
      type: fixed_month_day
      month: 12
      day: 23

  - key: jp_emperors_birthday
    name: Emperor's Birthday
    default_classification: CLOSED
    active_years:
      - [2020, null]
    rule:
      type: fixed_month_day
      month: 2
      day: 23
