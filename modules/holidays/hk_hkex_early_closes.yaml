kind: module
id: hk_hkex_early_closes

# Half-day trading sessions on the Hong Kong securities market: Christmas Eve, New Year's Eve and
# Lunar New Year's Eve. HKEX's own trading-hours page states the rule -- "There is no Extended
# Morning Session and Afternoon Session on the eves of Christmas, New Year and Lunar New Year" --
# and gives the half-day close as the 12:00 noon closing auction (12:00 to a random close between
# 12:08 and 12:10 p.m.), so 12:00 is the local close time recorded here.
#
# Christmas Eve (24 December) and New Year's Eve (31 December) are plain calendar dates, modelled
# as a recurring rule restricted to Monday-Friday: when 24 or 31 December falls on a Saturday or
# Sunday there is simply no session and no half day is moved anywhere (unlike the London Stock
# Exchange, which shifts the half day back to the preceding business day). Every occurrence the
# rule produces inside coverage is individually confirmed against hkex-calendar, except the two
# 2027 dates, which are confirmed by hkex-derivatives-holiday-schedule ("24 December 2027
# (Friday) - Eve of Christmas Day", "31 December 2027 (Friday) - Eve of New Year").
#
# Lunar New Year's Eve is represented as exact CHINESE_HK dates because its day is the actual last
# day of month twelve (29 or 30), not a fixed day selector. 2023 has no entry because the eve fell
# on Saturday 21 January.
# Source: hkex-securities-trading-hours (rule and close time), hkex-calendar (dated occurrences),
# hkex-derivatives-holiday-schedule (2027 Christmas/New Year eves).

source:
  - id: hkex-securities-trading-hours

event_sources:
  - key: hk_hkex_christmas_eve_early_close
    name: Christmas Eve (Half Day)
    default_classification: EARLY_CLOSE
    close_time: "12:00"
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    source:
      - id: hkex-securities-trading-hours
        ref: "no Extended Morning Session and Afternoon Session on the eves of Christmas, New Year and Lunar New Year"
      - id: hkex-calendar
        ref: "Half-Day Trading Day - Afternoon Session is Closed on Christmas's Eve"
      - id: hkex-derivatives-holiday-schedule
        ref: "24 December 2027 (Friday) - Eve of Christmas Day"
    rule:
      type: fixed_month_day
      month: 12
      day: 24

  - key: hk_hkex_new_years_eve_early_close
    name: New Year's Eve (Half Day)
    default_classification: EARLY_CLOSE
    close_time: "12:00"
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    source:
      - id: hkex-securities-trading-hours
        ref: "no Extended Morning Session and Afternoon Session on the eves of Christmas, New Year and Lunar New Year"
      - id: hkex-calendar
        ref: "Half-Day Trading Day - Afternoon Session is Closed on New Year's Eve"
      - id: hkex-derivatives-holiday-schedule
        ref: "31 December 2027 (Friday) - Eve of New Year"
    rule:
      type: fixed_month_day
      month: 12
      day: 31

  - key: hk_hkex_lunar_new_years_eve_early_close
    name: Lunar New Year's Eve (Half Day)
    default_classification: EARLY_CLOSE
    close_time: "12:00"
    shiftable: false
    status: CONFIRMED
    source:
      - id: hkex-calendar
        ref: "Half-Day Trading Day - Afternoon Session is Closed on Lunar New Year's Eve"
      - id: hko-gregorian-lunar-conversion
        ref: "Gregorian-Lunar conversion table"
    rule:
      type: native_explicit_dates
      dates:
        - {chronology_id: CHINESE_HK, year: 2017, month_code: M12, day: 30}
        - {chronology_id: CHINESE_HK, year: 2018, month_code: M12, day: 30}
        - {chronology_id: CHINESE_HK, year: 2019, month_code: M12, day: 30}
        - {chronology_id: CHINESE_HK, year: 2020, month_code: M12, day: 30}
        - {chronology_id: CHINESE_HK, year: 2021, month_code: M12, day: 29}
        - {chronology_id: CHINESE_HK, year: 2023, month_code: M12, day: 30}
        - {chronology_id: CHINESE_HK, year: 2024, month_code: M12, day: 29}
        - {chronology_id: CHINESE_HK, year: 2025, month_code: M12, day: 29}
        - {chronology_id: CHINESE_HK, year: 2026, month_code: M12, day: 29}
