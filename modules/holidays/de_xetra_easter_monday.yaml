kind: module
id: de_xetra_easter_monday

# Easter Monday. Xetra: closed every year 2003-2026 without exception (confirmed against every
# trading calendar in sources/DE-XETRA/README.md). Not shiftable: Easter Monday always falls on
# a Monday, so weekend shifting never applies.

source:
  - id: xetra-trading-calendar-2003
    ref: "exceptions sentence: Easter Monday date"
  - id: xetra-trading-calendar-2026
    ref: "exceptions sentence: Easter Monday date"

references:
  - key: easter
    formula: EASTER_WESTERN

event_sources:
  - key: de_xetra_easter_monday
    name: Easter Monday
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: relative_to_reference
      key: de_xetra_easter_monday
      name: Easter Monday
      reference: easter
      offset_days: 1
