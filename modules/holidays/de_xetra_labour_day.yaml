kind: module
id: de_xetra_labour_day

# Labour Day / Tag der Arbeit (May 1). Xetra: closed every year 2003-2026 when 1 May falls on a
# weekday; not shifted when it falls on a weekend. Source: sources/DE-XETRA/README.md (confirmed
# against every trading calendar 2003-2026).

source:
  - id: xetra-trading-calendar-2003
    ref: "exceptions sentence: 1 May"
  - id: xetra-trading-calendar-2026
    ref: "exceptions sentence: 1 May"

event_sources:
  - key: de_xetra_labour_day
    name: Labour Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 5
      day: 1
