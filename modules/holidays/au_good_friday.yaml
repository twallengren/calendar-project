kind: module
id: au_good_friday

# Good Friday (two days before Western Easter Sunday). Always a weekday, so no shifting.
# Source: nsw-public-holidays-act.

source:
  - id: nsw-public-holidays-act

references:
  - key: easter
    formula: EASTER_WESTERN

event_sources:
  - key: au_good_friday
    name: Good Friday
    default_classification: CLOSED
    rule:
      type: relative_to_reference
      key: au_good_friday
      name: Good Friday
      reference: easter
      offset_days: -2
