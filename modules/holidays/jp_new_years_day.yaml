kind: module
id: jp_new_years_day

# 元日 (Gantan), January 1. Art. 2 of the Act on National Holidays.
#
# shift_policy: NONE is deliberate. Art. 3(2) does move a Sunday January 1 to January 2 (JPX
# publishes "Jan. 2 (Mon.) New Year's Day (Jan. 1) observed" for 2023), but January 2 is already
# a JPX market holiday, so the substitute never changes which days the exchange is open. Under
# the calendar's cascading policy the substitute would instead skip past the January 2 and
# January 3 market holidays and wrongly close January 4, the year's first trading day.
#
# only_if_weekday then keeps the calendar uniform: with the substitute rule every other national
# holiday that lands on a weekend produces a WEEKEND row rather than a closure row, and a
# weekend January 1 should look the same. The exchange is closed December 31 through January 3
# either way, so no trading day changes.
# See sources/JP-JPX/README.md.

source:
  - id: cao-shukujitsu-gaiyou
    ref: "第2条 元日 1月1日"

event_sources:
  - key: jp_new_years_day
    name: New Year's Day
    default_classification: CLOSED
    shift_policy: NONE
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    rule:
      type: fixed_month_day
      month: 1
      day: 1
