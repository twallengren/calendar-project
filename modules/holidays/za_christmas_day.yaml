kind: module
id: za_christmas_day

# Christmas Day (25 December). A Sunday Christmas (2011, 2016, 2022) gives no automatic extra day:
# the Monday is already the Day of Goodwill and the Act's s 2(1) adds nothing further ("Monday
# 26 December 2011 is the Day of Goodwill, meaning that it falls outside the ambit of the Public
# Holidays Act as it stands", sanews-2011-12-15). In each of those years the Tuesday 27 December
# was separately declared under s 2A and is listed in za_one_off_public_holidays; the exchange's
# own notice of 7 October 2011 had first called 27 December 2011 a "normal business day". So this
# rule never shifts (shift_policy NONE); a Saturday Christmas (2010, 2021, 2027) brings no
# substitute either.
# Source: za-public-holidays-act (the statute), jse-markets-calendars (the exchange's calendars).

source:
  - id: za-public-holidays-act

event_sources:
  - key: za_christmas_day
    name: Christmas Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 12
      day: 25
