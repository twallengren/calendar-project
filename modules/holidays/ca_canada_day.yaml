kind: module
id: ca_canada_day

# Canada Day, July 1, fixed by the federal Holidays Act. When it falls on a weekend it is
# observed the following Monday (not the preceding Friday): tmx-canada-day-2017 (Sat Jul 1,
# 2017 -> Mon Jul 3, 2017) and tmx-canada-day-2023 (Sat Jul 1, 2023 -> Mon Jul 3, 2023) both
# confirm this, so the calendar's default NEXT_AVAILABLE_WEEKDAY shift policy is used as-is.

source:
  - id: holidays-act-canada
  - id: tmx-canada-day-2017
  - id: tmx-canada-day-2023

event_sources:
  - key: ca_canada_day
    name: Canada Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 7
      day: 1
