kind: module
id: jp_greenery_day

# みどりの日 (Midori no Hi), May 4 since 2007. Before the 2007 reform Greenery Day was April 29
# (now 昭和の日) and May 4 was a citizens' holiday under Art. 3(3); both predate this calendar's
# coverage.

source:
  - id: cao-shukujitsu-gaiyou
    ref: "第2条 みどりの日 5月4日"

event_sources:
  - key: jp_greenery_day
    name: Greenery Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 5
      day: 4
