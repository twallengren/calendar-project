kind: module
id: hk_lunar_new_year

# Lunar New Year: the first, second and third days of the first lunar month are Hong Kong
# general holidays (General Holidays Ordinance, Cap. 149, Schedule). When one of the three falls
# on a Sunday, the fourth day of Lunar New Year is a general holiday in its place.
#
# The lunar calendar is not modelled in this project, so every date below is transcribed from the
# Hong Kong Government's gazetted general holidays list for that year -- none is computed. Only
# the dates that fall Monday-Friday are listed: a Lunar New Year day that falls on a Saturday
# (17 Feb 2018, 25 Jan 2020, 13 Feb 2021, 10 Feb 2024, 6 Feb 2027) carries no
# trading session and no substitute day.
# Source: govhk-general-holidays / govhk-general-holidays-archived (gazetted dates),
# hkex-calendar (market closed).

source:
  - id: govhk-general-holidays
  - id: hkex-calendar

