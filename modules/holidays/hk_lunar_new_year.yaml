kind: module
id: hk_lunar_new_year

# Lunar New Year: the first, second and third days of the first lunar month are Hong Kong
# general holidays (General Holidays Ordinance, Cap. 149, Schedule). When one of the three falls
# on a Sunday, the fourth day of Lunar New Year is a general holiday in its place.
#
# The bounded native rule models the first three days for the exchange-evidenced 2018-2027
# interval. A Sunday occurrence cascades past the other New Year holidays to day four; a Saturday
# occurrence is not substituted. CHINESE_HK supplies the native origin while the Government and
# HKEX sources remain the authority that the market closes on the resulting dates. Calendar
# deltas replace ICU's affected 2027 rows: HKO starts that near-midnight lunar year one day
# earlier, and both the gazette and HKEX end the holiday on 9 February.

source:
  - id: govhk-general-holidays
  - id: hkex-calendar
  - id: hko-gregorian-lunar-conversion

event_sources:
  - key: hk_lunar_new_year
    name: Lunar New Year
    default_classification: CLOSED
    shiftable: true
    shift_policy: NEXT_AVAILABLE_FROM_LAST_WEEKEND_DAY
    status: CONFIRMED
    rule:
      type: native_fixed_month_day
      chronology: CHINESE_HK
      month_codes: [M01]
      day: 1
      duration_days: 3
      native_years: [{start: 2018, end: 2027}]
