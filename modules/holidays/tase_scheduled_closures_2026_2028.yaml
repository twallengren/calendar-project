      native_years: [{start: 5787, end: 5789}]

  # "On a Friday before a Sunday that is a holiday eve or a public holiday, no trading will take
  # place": Friday 7 Tishri precedes the Sunday Yom Kippur Eve of 5787 and 5788, and Friday
  # 12 Adar 5788 precedes Sunday Purim.
  - key: tase_friday_before_sunday_holiday
    name: Friday Before a Sunday Holiday (No Trading)
    shiftable: false
    source:
      - id: tase-trading-vacation-schedule
        ref: "* On a Friday before a Sunday that is a holiday eve or a public holiday, no trading will take place"
    rule:
      type: native_explicit_dates
      dates:
        - {chronology_id: HEBREW, year: 5787, month_code: TISHRI, day: 7}
        - {chronology_id: HEBREW, year: 5788, month_code: TISHRI, day: 7}
        - {chronology_id: HEBREW, year: 5788, month_code: ADAR, day: 12}

