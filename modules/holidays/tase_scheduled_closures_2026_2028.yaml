  - key: tase_memorial_day_2027
    name: Memorial Day
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [IYAR]
      day: 4
      native_years: [{start: 5787, end: 5787}]

  - key: tase_independence_day_2027
    name: Independence Day
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [IYAR]
      day: 5
      native_years: [{start: 5787, end: 5787}]

  # 5 Iyar 5788 is a Monday, so Independence Day is observed on Tuesday 2 May 2028 and
  # Memorial Day on Monday 1 May 2028 (TASE rows "May-1 Monday Memorial Day", "May-2 Tuesday
  # Independence Day").
  - key: tase_memorial_day_2028
    name: Memorial Day
    shiftable: false
    rule:
      type: native_relative_to_reference
      chronology: HEBREW
      month_codes: [IYAR]
      day: 4
      offset_days: 1
      native_years: [{start: 5788, end: 5788}]

  - key: tase_independence_day_2028
    name: Independence Day
    shiftable: false
    rule:
      type: native_relative_to_reference
      chronology: HEBREW
      month_codes: [IYAR]
      day: 5
      offset_days: 1
      native_years: [{start: 5788, end: 5788}]

