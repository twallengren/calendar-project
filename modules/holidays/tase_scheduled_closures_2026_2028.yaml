kind: module
id: tase_scheduled_closures_2026_2028

# TASE's official vacation schedule page (tase-trading-vacation-schedule) lists every 2026, 2027 and
# 2028 non-trading day. Each row is retained as a bounded Hebrew-calendar origin, as the 2025
# module does: regular religious dates are native recurrences over 5786-5789, and the civil
# Memorial/Independence pair is modelled per year because its statutory shift differs
# (unshifted 4/5 Iyar in 5786 and 5787, +1 day in 5788 when 5 Iyar is a Monday). The Monday-Friday
# week means Rosh Hashanah I and other Saturday rows are not listed by TASE; the rules still emit
# them on the weekend day, which the NONE shift policy keeps as a plain closure. 2026 Memorial and
# Independence Days live in tase_verified_events_2026. Every ISO date produced here was checked
# against the TASE table row for row (see sources/IL-TASE/README.md).
source:
  - id: tase-trading-vacation-schedule
    ref: "2026, 2027 and 2028 vacation schedule tables"

event_sources:
  - key: tase_purim
    name: Purim
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [ADAR, ADAR_II]
      day: 14
      native_years: [{start: 5786, end: 5788}]

  - key: tase_passover_eve
    name: Passover Eve
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [NISAN]
      day: 14
      native_years: [{start: 5786, end: 5788}]

  - key: tase_passover
    name: Passover
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [NISAN]
      day: 15
      native_years: [{start: 5786, end: 5788}]

  - key: tase_seventh_passover_eve
    name: Seventh Day of Passover Eve
    shiftable: false
    rule:
      type: native_fixed_month_day
      chronology: HEBREW
      month_codes: [NISAN]
      day: 20
      native_years: [{start: 5786, end: 5788}]

  - key: tase_seventh_passover
    name: Seventh Day of Passover
    shiftable: false
