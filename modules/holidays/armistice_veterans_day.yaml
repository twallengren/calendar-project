kind: module
id: armistice_veterans_day

# Armistice Day / Veterans Day (November 11).
# NYSE closed all day in 1918 and 1921, and every year 1934-1953. From 1922 to 1933 the
# Exchange paused for two minutes but stayed open, and from 1954 it did not close.
# Source: nyse-history-2008.

source:
  - id: nyse-history-2008
    ref: Armistice/Veteran's Day

event_sources:
  - key: armistice_veterans_day
    name: Armistice Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    active_years:
      - 1918
      - 1921
      - [1934, 1953]
    rule:
      type: fixed_month_day
      month: 11
      day: 11
