kind: module
id: lincolns_birthday

# Lincoln's Birthday (February 12). NYSE closed every year 1896-1953.
# Source: nyse-history-2008.

source:
  - id: nyse-history-2008
    ref: Lincoln's Birthday

event_sources:
  - key: lincolns_birthday
    name: Lincoln's Birthday
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    active_years:
      - [1896, 1953]
    rule:
      type: fixed_month_day
      month: 2
      day: 12
