kind: module
id: kr_national_foundation_day

# National Foundation Day (개천절, 3 October), a national day. Substitutes from the 4 August 2021
# amendment: Monday 4 October 2021, Monday 5 October 2026, Monday 4 October 2027. Tuesday
# 3 October 2017 was also the eve of Chuseok; the exchange's list names it 개천절, and the Chuseok
# block's substitute fell on Friday 6 October 2017.
# Source: krx-holidays (the exchange's own non-trading-day lists), moi-public-holidays-decree.

source:
  - id: krx-holidays

event_sources:
  - key: kr_national_foundation_day
    name: National Foundation Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 10
      day: 3

  - key: kr_national_foundation_day_substitute
    name: National Foundation Day (substitute holiday)
    default_classification: CLOSED
    rule:
      type: explicit_dates
      dates:
        - 2021-10-04
        - 2026-10-05
        - 2027-10-04
