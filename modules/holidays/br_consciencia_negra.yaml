kind: module
id: br_consciencia_negra

# Black Consciousness Day (Dia da Consciência Negra, 20 November). A São Paulo municipal holiday
# (Lei municipal 13.707/2004) on which the exchange closed through 2019 when a weekday (2012-2015,
# 2017-2019); the exchange traded on Friday 20 November 2020 (OC 072/2020-PRE: "as atividades de
# negociação, liquidação, registro e depósito centralizado de ativos funcionarão normalmente")
# and, after it stopped observing São Paulo holidays from the 2022 calendar, on Monday 20 November
# 2023 (OC 182/2023, Quadro B "funcionamento normal da B3"). A national holiday from Lei
# 14.759/2023 (in force 21 December 2023), so the exchange closes again from 2024 (OC 215/2023
# moved the date into the national table; the exchange's news of 17 November 2025: "a B3 não terá
# operação"). 2021 and 2022 fell on a weekend.
# Source: br-lei-14759-2023, br-lei-sp-13707-2004, b3-calendars.

source:
  - id: br-lei-14759-2023

event_sources:
  - key: br_consciencia_negra_sao_paulo
    name: Consciência Negra (São Paulo municipal holiday)
    default_classification: CLOSED
    shift_policy: NONE
