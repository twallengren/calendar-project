kind: module
id: uk_new_years_day

# New Year's Day (1 January). England & Wales: closed every year, established by Royal
# Proclamation under the Banking and Financial Dealings Act 1971 (see uk-1971-act in
# sources/GB-LSE/README.md). Weekend observance inherits the calendar's
# NEXT_AVAILABLE_WEEKDAY policy: Saturday -> Monday, Sunday -> Monday.
# Source: govuk-bank-holidays.

source:
  - id: govuk-bank-holidays

event_sources:
  - key: uk_new_years_day
    name: New Year's Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 1
      day: 1
