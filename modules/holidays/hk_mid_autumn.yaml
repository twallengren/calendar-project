kind: module
id: hk_mid_autumn

# The day following the Chinese Mid-Autumn Festival. A Hong Kong general holiday (General
# Holidays Ordinance, Cap. 149, Schedule) -- note that the holiday is the day AFTER the festival,
# not the festival itself. The bounded CHINESE_HK rule selects day 16 of month eight for the
# exchange-evidenced 2018-2027 interval. Sunday is substituted; Saturday is not.

source:
  - id: govhk-general-holidays
  - id: hkex-calendar
  - id: hko-gregorian-lunar-conversion

event_sources:
  - key: hk_mid_autumn
    name: The day following the Chinese Mid-Autumn Festival
    default_classification: CLOSED
    shiftable: true
    shift_policy: FORWARD_ONLY
    status: CONFIRMED
    rule:
      type: native_fixed_month_day
      chronology: CHINESE_HK
      month_codes: [M08]
      day: 16
      native_years: [{start: 2018, end: 2027}]
