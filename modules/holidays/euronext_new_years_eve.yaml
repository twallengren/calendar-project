kind: module
id: euronext_new_years_eve

# New Year's Eve (31 December) half trading day on the Euronext cash markets, for the venues
# whose local wall clock is CET/CEST (Amsterdam, Brussels, Paris). See
# euronext_new_years_eve_lisbon for the Europe/Lisbon (WET/WEST) equivalent, and
# euronext_special_closures for 31 December 2015, which was a full closure instead.
#
# Close time 14:00 CET through 2013 and 14:05 CET from 2014; the half day is not moved when
# 31 December falls on a weekend (2011, 2016, 2022: Sat; 2017, 2023: Sun).

event_sources:
  - key: euronext_new_years_eve
    name: New Year's Eve (half trading day)
    default_classification: EARLY_CLOSE
    shiftable: false
    shift_policy: NONE
    close_time: "14:00"
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years:
      - [null, 2013]
    source:
      - id: nyse-euronext-calendar-2013
        ref: "31 December 2013 at 14:00 CET"
    rule:
      type: fixed_month_day
      month: 12
      day: 31

  - key: euronext_new_years_eve_1405
    name: New Year's Eve (half trading day)
    default_classification: EARLY_CLOSE
    shiftable: false
    shift_policy: NONE
    close_time: "14:05"
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years:
      - [2014, null]
    source:
      - id: euronext-hours-holidays
        ref: "half trading day, all instruments closing by 14:05 CET"
    rule:
      type: fixed_month_day
      month: 12
      day: 31
