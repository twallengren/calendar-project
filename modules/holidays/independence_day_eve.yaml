kind: module
id: independence_day_eve

# Early closes around Independence Day, NYSE, 1:00 pm since 1995.
# - July 3 when it falls Monday, Tuesday or Thursday (July 4 on Tue/Wed/Fri). A Friday July 3
#   is the observed holiday (full closure) and takes precedence.
# - Through 2012: Friday July 5 when July 4 fell on a Thursday.
# - Since 2013: Wednesday July 3 instead, when July 4 falls on a Thursday.
# Source: nyse-history-2008 (special closings 1995-2007), nyse-hours (2008 onward).

source:
  - id: nyse-history-2008
    ref: special closings 1995-2007
  - id: nyse-hours

event_sources:
  - key: independence_day_eve
    name: Independence Day Eve (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "13:00"
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, THURSDAY]
    active_years:
      - [1995, null]
    rule:
      type: fixed_month_day
      month: 7
      day: 3

  - key: independence_day_eve_wednesday
    name: Independence Day Eve (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "13:00"
    shiftable: false
    only_if_weekday: [WEDNESDAY]
    active_years:
      - [2013, null]
    rule:
      type: fixed_month_day
      month: 7
      day: 3

  - key: day_after_independence_day_early_close
    name: Day After Independence Day (Early Close)
    default_classification: EARLY_CLOSE
    close_time: "13:00"
    shiftable: false
    only_if_weekday: [FRIDAY]
    active_years:
      - [1995, 2012]
    rule:
      type: fixed_month_day
      month: 7
      day: 5
