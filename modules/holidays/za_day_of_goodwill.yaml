kind: module
id: za_day_of_goodwill

# South Africa's Public Holidays Act 36 of 1994, s 2(1): "whenever any public holiday falls on a
# Sunday, the following Monday shall be a public holiday"; a Saturday holiday is not substituted.
# The calendar's FORWARD_ONLY policy expresses that. The JSE closes all markets on every public
# holiday ("As with all other public holidays in South Africa, the JSE will be closed for business
# on this day", jse-notice-y1346a-2014).
# Day of Goodwill (26 December): Monday 27 December 2010, 2021 and 2027 (Sunday 26 December);
# Saturday 26 December 2015 and 2020 brought no substitute.
# Source: za-public-holidays-act (the statute), jse-markets-calendars (the exchange's calendars).

source:
  - id: za-public-holidays-act

event_sources:
  - key: za_day_of_goodwill
    name: Day of Goodwill
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 12
      day: 26
