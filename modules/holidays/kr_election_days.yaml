kind: module
id: kr_election_days

# Election days: elections on expiry of a term are public holidays (공직선거법 제34조; decree art. 2
# no. 10-2) and early elections were designated temporary public holidays; the exchange closed on
# every one (its lists name them or, for 2024-2026, label them 임시공휴일; KIND notice 99340 cites
# 업무규정 제5조 for 10 April 2024).
# Source: krx-holidays.

source:
  - id: krx-holidays

event_sources:
  - key: kr_election_days
    name: Election Day
    default_classification: CLOSED
    shiftable: false
    rule:
      type: explicit_dates
      dates:
        - date: 2010-06-02
          comment: 5th nationwide local elections
        - date: 2012-04-11
          comment: 19th National Assembly election
        - date: 2012-12-19
          comment: 18th presidential election
        - date: 2014-06-04
          comment: 6th nationwide local elections
        - date: 2016-04-13
          comment: 20th National Assembly election
        - date: 2017-05-09
          comment: 19th presidential election (early election; temporary public holiday)
        - date: 2018-06-13
          comment: 7th nationwide local elections
        - date: 2020-04-15
          comment: 21st National Assembly election
        - date: 2022-03-09
          comment: 20th presidential election
        - date: 2022-06-01
          comment: 8th nationwide local elections
        - date: 2024-04-10
          comment: 22nd National Assembly election
        - date: 2025-06-03
          comment: 21st presidential election (early election; temporary public holiday)
        - date: 2026-06-03
          comment: 9th nationwide local elections
