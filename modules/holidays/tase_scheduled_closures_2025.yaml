kind: module
id: tase_scheduled_closures_2025

# The rules retain each official 2025 schedule row as a Hebrew-calendar origin. Regular religious
# dates use bounded native recurrences. Israel's 2025 Memorial and Independence Days were moved
# from 4/5 Iyar to 2/3 Iyar; native relative rules record those two-day adjustments without
# pretending they are a general observance formula. No rule extends beyond its evidenced year.
source:
  - id: tase-vacation-schedule-2025
    ref: "Complete 2025 vacation table, rows 14 March through 14 October"

