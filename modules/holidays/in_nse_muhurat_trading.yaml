kind: module
id: in_nse_muhurat_trading

# Muhurat trading: the one-hour session the exchange holds on Diwali (Laxmi Pujan) every year, a
# day its own annual list calls a trading holiday (or a weekend day). "All trades executed in this
# Diwali Muhurat trading session shall result in settlement obligations" (every circular from
# 2013), and a bhavcopy is published for the day (nse-bhavcopy-availability). Times are the
# normal-market window of each year's timing circular; the block-deal, pre-open and closing
# sessions around it are session structure. Each year is its own event source because the times
# differ. 2026 (Sunday 8 November): the annual list (NSE/CMTR/71775) announces the session with
# "timings shall be notified subsequently"; until they are, the row is PROJECTED with the window
# used 2019-2023, and the calendar marks session detail incomplete on that date.

source:
  - id: nse-muhurat-circulars

