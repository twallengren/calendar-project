kind: module
id: br_nossa_senhora_aparecida

# Our Lady of Aparecida (12 October), a national holiday (Lei 6.802/1980).
# Brazil has no weekend substitution: a holiday on a Saturday or Sunday is simply not a trading
# closure (the exchange's tables list such days with no replacement), hence shift_policy NONE.

# Source: br-lei-6802-1980, b3-calendars (the exchange's annual holiday circulars).

source:
  - id: br-lei-6802-1980

event_sources:
  - key: br_nossa_senhora_aparecida
    name: Nossa Senhora Aparecida
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 10
      day: 12
