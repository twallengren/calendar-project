kind: module
id: sg_chinese_new_year

# Chinese New Year: the first two days of the first lunar month are public holidays, dated each
# year by the Ministry of Manpower's gazetted list. When either day falls on a Sunday the next
# day that is not already a holiday is a public holiday: Tuesday 16 February 2010, Tuesday
# 12 February 2013, Monday 30 January 2017, Monday 27 January 2020, Tuesday 24 January 2023,
# Monday 12 February 2024 and Monday 8 February 2027 (MOM 2013: "As Chinese New Year falls on
# Sunday 10 February 2013 and Monday 11 February 2013, the next day, Tuesday 12 February 2013,
# will be a public holiday."). A Saturday first day (2014, 2018, 2021, 2024, 2027) gets no
# substitute of its own. The calendar's NEXT_AVAILABLE_FROM_LAST_WEEKEND_DAY policy produces
# exactly these dates from the gazetted days.
# Source: mom-public-holidays and the per-year MOM lists cited in sources/SG-SGX/register.json.

source:
  - id: mom-public-holidays

event_sources:
  - key: sg_chinese_new_year
    name: Chinese New Year
    default_classification: CLOSED
