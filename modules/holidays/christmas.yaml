kind: module
id: christmas

# Christmas Day (December 25). NYSE: closed every year.
# Observance: Sunday -> Monday throughout. Saturday -> preceding Friday only since NYSE Rule 51
# (adopted July 3, 1959); before that a Saturday Christmas was simply a closed Saturday
# (a session day until 1952), with any Friday observance listed as a special closing.
# Source: nyse-history-2008.

source:
  - id: nyse-history-2008
    ref: "Christmas Day; Rule 51 note"

event_sources:
  - key: christmas
    name: Christmas Day
    default_classification: CLOSED
    shift_policy: NEAREST_WEEKDAY
    active_years:
      - [1959, null]
    rule:
      type: fixed_month_day
      month: 12
      day: 25

  - key: christmas_pre1959
    name: Christmas Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    active_years:
      - [null, 1958]
    rule:
      type: fixed_month_day
      month: 12
      day: 25
