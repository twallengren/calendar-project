kind: module
id: columbus_day

# Columbus Day (October 12). NYSE closed every year 1909-1953.
# Source: nyse-history-2008.

source:
  - id: nyse-history-2008
    ref: Columbus Day

event_sources:
  - key: columbus_day
    name: Columbus Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    active_years:
      - [1909, 1953]
    rule:
      type: fixed_month_day
      month: 10
      day: 12
