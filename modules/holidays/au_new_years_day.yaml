kind: module
id: au_new_years_day

# New Year's Day (1 January), a national public holiday observed in New South Wales. When it
# falls on a Saturday or Sunday the following Monday is an additional public holiday (Public
# Holidays Act 2010 (NSW) s 4, and the pre-2011 proclamations within this coverage), and the
# ASX is closed on that Monday instead: Mon 3 Jan 2011, 2022 and 2028; Mon 2 Jan
# 2012, 2017 and 2023. The calendar's NEXT_AVAILABLE_WEEKDAY policy produces exactly that.
# Source: nsw-public-holidays-act, asx-trading-calendars.

source:
  - id: nsw-public-holidays-act

event_sources:
  - key: au_new_years_day
    name: New Year's Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 1
      day: 1
