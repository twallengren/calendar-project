kind: module
id: in_christmas

# Christmas: as dated in the exchange's annual trading-holiday circulars (Capital Market Segment),
# weekday occurrences only; the exchange never substitutes a weekday for a holiday that falls on a
# Saturday or Sunday. The circulars spell it: Christmas.
# Source: nse-holiday-lists.

source:
