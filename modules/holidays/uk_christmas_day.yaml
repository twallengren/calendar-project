kind: module
id: uk_christmas_day

# Christmas Day (25 December). England & Wales: closed every year; a common-law holiday
# (dcms-mayday-preconsultation, section 2.1 table). Weekend observance inherits the calendar's
# NEXT_AVAILABLE_WEEKDAY policy, cascading with Boxing Day: Saturday -> Monday (Boxing Day Sunday
# -> Tuesday); Sunday -> Monday if free, else Tuesday.
# Source: govuk-bank-holidays.

source:
  - id: govuk-bank-holidays

event_sources:
  - key: uk_christmas_day
    name: Christmas Day
    default_classification: CLOSED
    rule:
      type: fixed_month_day
      month: 12
      day: 25
