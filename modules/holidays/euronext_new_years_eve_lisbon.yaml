kind: module
id: euronext_new_years_eve_lisbon

# New Year's Eve (31 December) half trading day on Euronext Lisbon: euronext_new_years_eve
# with the pan-European CET close time expressed in Europe/Lisbon local time (WET/WEST, one
# hour behind CET all year). See euronext_christmas_eve_lisbon for the reasoning, and
# euronext_special_closures for 31 December 2015, which was a full closure instead.

event_sources:
  - key: euronext_new_years_eve
    name: New Year's Eve (half trading day)
    default_classification: EARLY_CLOSE
    shiftable: false
    shift_policy: NONE
    close_time: "13:00"
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years:
      - [null, 2013]
    source:
      - id: nyse-euronext-calendar-2013
        ref: "31 December 2013 at 14:00 CET (13:00 Lisbon time)"
    rule:
      type: fixed_month_day
      month: 12
      day: 31

  - key: euronext_new_years_eve_1405
    name: New Year's Eve (half trading day)
    default_classification: EARLY_CLOSE
    shiftable: false
    shift_policy: NONE
    close_time: "13:05"
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years:
      - [2014, null]
    source:
      - id: euronext-hours-holidays
        ref: "half trading day, all instruments closing by 14:05 CET (13:05 Lisbon time)"
    rule:
      type: fixed_month_day
      month: 12
      day: 31
