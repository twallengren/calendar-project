kind: module
id: de_xetra_boxing_day

# Boxing Day / 2. Weihnachtsfeiertag (December 26). Xetra: closed every year 2003-2026 when
# 26 December falls on a weekday; not shifted when it falls on a weekend. Source:
# sources/DE-XETRA/README.md.

source:
  - id: xetra-trading-calendar-2003
    ref: "exceptions sentence: 24-26 December"
  - id: xetra-trading-calendar-2024
    ref: "exceptions sentence: 26 December"

event_sources:
  - key: de_xetra_boxing_day
    name: Boxing Day
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 12
      day: 26
