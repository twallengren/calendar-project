kind: module
id: juneteenth

# Juneteenth National Independence Day (June 19). NYSE has observed it since 2022, with the
# standard nearest-weekday observance (Sunday June 19, 2022 was observed Monday June 20).
# Source: nyse-hours (NYSE Holidays & Trading Hours).

source:
  - id: nyse-hours

event_sources:
  - key: juneteenth
    name: Juneteenth National Independence Day
    default_classification: CLOSED
    shift_policy: NEAREST_WEEKDAY
    active_years:
      - [2022, null]
    rule:
      type: fixed_month_day
      month: 6
      day: 19
