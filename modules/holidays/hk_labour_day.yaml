kind: module
id: hk_labour_day

# Labour Day (1 May). A Hong Kong general holiday (General Holidays Ordinance, Cap. 149,
# Schedule). Sunday -> following Monday ("the day following Labour Day", 2 May 2022); a Saturday
# 1 May is not substituted (2021 and 2027), so FORWARD_ONLY is exact.
# Source: govhk-general-holidays / govhk-general-holidays-archived (gazetted dates),
# hkex-calendar (market closed).

source:
  - id: govhk-general-holidays
  - id: hkex-calendar

event_sources:
  - key: hk_labour_day
    name: Labour Day
    default_classification: CLOSED
    shift_policy: FORWARD_ONLY
    rule:
      type: fixed_month_day
      month: 5
      day: 1
