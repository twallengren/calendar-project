kind: module
id: us_nyse_special_closings_pre1960

# Special closings of the New York Stock Exchange, 1900-1959, that the holiday rules do not
# produce: Saturday closings adjacent to holidays (Saturday was a trading session until May
# 1952), Friday observances of Saturday holidays, clerical-backlog closings in 1928-1930, and
# other one-off closings.
#
# Every date appears in the NYSE's own "History of New York Stock Exchange Holidays" (special
# closings list, revised November 2008); the dates were extracted through the structured 2022
# rule model derived from that document. See sources/US-NYSE/README.md.
#
# Modelling note: when a holiday fell on a Saturday before July 1959 the Exchange was closed on
# the Saturday itself (a session day) and, in the years listed under "... (observed)", also on
# the preceding Friday. Both days are emitted as CLOSED.

source:
  - id: nyse-history-2008
    ref: special closings list
  - id: nyse-legacy-model-2022

