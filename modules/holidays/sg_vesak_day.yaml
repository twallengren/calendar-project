# Vesak Day, dated each year by the Ministry of Manpower from the Singapore Buddhist Federation.
# Sunday occurrences move to Monday (20 May 2019, 16 May 2022, 1 June 2026); Saturday
# occurrences (21 May 2016) bring no substitute. 2023 was revised from Saturday 3 June to
# Friday 2 June (MOM, 29 September 2022).
# Source: mom-public-holidays and the per-year MOM lists.

