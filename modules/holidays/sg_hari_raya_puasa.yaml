# Hari Raya Puasa (Eid al-Fitr), dated each year by the Ministry of Manpower from the Islamic
# Religious Council (MUIS). Sunday occurrences move to Monday (20 August 2012, 26 June 2017,
# 25 May 2020); Saturday occurrences (22 April 2023, 21 March 2026) bring no substitute. 2022 was
# revised from 2 May to 3 May (MOM, 21 October 2021).
# Source: mom-public-holidays and the per-year MOM lists.

