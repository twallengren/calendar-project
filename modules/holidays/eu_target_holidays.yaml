kind: module
id: eu_target_holidays

# The ECB's euro T2 calendar closes on these six days in addition to weekends. Fixed-date holiday
# rows are emitted only on weekdays because a weekend occurrence adds no closure and receives no
# substitute day. All sources are bounded to the reviewed 2026-2027 interval even though the
# standing rule is older. In this interval 26 December falls only on weekends, so it is represented
# by the weekend policy and has no dead event rule.

source:
  - id: ecb-t2-opening-hours
  - id: ecb-target-holidays-2026-2027

references:
  - key: eu_target_easter
    formula: EASTER_WESTERN

event_sources:
  - key: eu_target_new_years_day
    name: New Year's Day
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule:
      type: fixed_month_day
      month: 1
      day: 1

  - key: eu_target_good_friday
    name: Good Friday
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule:
      type: relative_to_reference
      reference: eu_target_easter
      offset_days: -2

  - key: eu_target_easter_monday
    name: Easter Monday
    shiftable: false
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule:
      type: relative_to_reference
      reference: eu_target_easter
      offset_days: 1

  - key: eu_target_labour_day
    name: Labour Day
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule:
      type: fixed_month_day
      month: 5
      day: 1

  - key: eu_target_christmas_day
    name: Christmas Day
    shiftable: false
    only_if_weekday: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    active_years: [[2026, 2027]]
    status: CONFIRMED
    rule:
      type: fixed_month_day
      month: 12
      day: 25
