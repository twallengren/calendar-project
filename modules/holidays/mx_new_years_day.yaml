kind: module
id: mx_new_years_day

# New Year's Day (1 January), a mandatory rest day (Ley Federal del Trabajo art. 74) on the CNBV's
# list every year.
# Mexico's financial calendar has no weekend substitution: the CNBV's annual list gives fixed dates
# plus Saturdays and Sundays, and a fixed-date holiday on a weekend is simply lost (shift_policy
# NONE).
# Source: cnbv-dias-inhabiles, bmv-calendario-2026.

source:
  - id: cnbv-dias-inhabiles

event_sources:
  - key: mx_new_years_day
    name: Año Nuevo
    default_classification: CLOSED
    shift_policy: NONE
    rule:
      type: fixed_month_day
      month: 1
      day: 1
