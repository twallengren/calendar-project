id: kr_seollal

# Seollal: the day before, the day of and the day after Lunar New Year (lunar 12/30-1/2), as dated
# in the exchange's lists. From 2014 a Sunday overlap (not a Saturday one) is substituted on the next
# non-holiday: 10 February 2016, 30 January 2017, 27 January 2020, 24 January 2023, 12 February
# 2024, 9 February 2027. Only the weekday dates are listed (the weekend days are not trading
# days); the 2010-2013 rows carry no names in the exchange's service and are identified by date.
# Source: krx-holidays.

source:
