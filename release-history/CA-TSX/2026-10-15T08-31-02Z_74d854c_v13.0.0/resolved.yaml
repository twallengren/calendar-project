    type: nth_weekday_of_month
    month: 10
    weekday: MONDAY
    nth: 2
- key: ca_christmas
  name: Christmas Day
  origin: module:ca_christmas
  classification: CLOSED
  shiftable: true
  displaces:
  - ca_boxing_day
  status: CONFIRMED
  source:
  - id: tmx-holiday-schedule-2016
    ref: "Closed Mon Dec 26, 2016 \"in lieu of Christmas Day on Sunday, December 25,\
      \ 2016\" and Tue Dec 27, 2016 \"in lieu of Boxing Day on Monday, December 26,\
      \ 2016\""
  - id: tmx-canada-holiday-2022
    ref: Same Mon Dec 26 / Tue Dec 27 ordering for the Sunday Christmas of 2022
  - id: tmx-holiday-schedule-2021
    ref: "Sat Dec 25, 2021 observed Mon Dec 27, 2021 (no displacement needed)"
  - id: holidays-act-canada
  - id: tsx-calendar-page
  rule:
    type: fixed_month_day
    month: 12
    day: 25
- key: ca_christmas_eve_early_close
  name: Christmas Eve
  origin: module:ca_christmas
  classification: EARLY_CLOSE
  shiftable: true
  close_time: 13:00
  status: CONFIRMED
