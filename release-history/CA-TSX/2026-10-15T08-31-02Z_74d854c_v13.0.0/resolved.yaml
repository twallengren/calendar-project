    ref: "In Lieu of Boxing Day: Dec 28, 2026"
  - id: tmx-holiday-schedule-2021
    ref: "Boxing Day (nominal Sun Dec 26, 2021) observed Tue Dec 28, 2021"
  rule:
    type: fixed_month_day
    month: 12
    day: 26
- key: ca_tsx_unscheduled_closure
  name: Unscheduled Closure
  origin: module:ca_tsx_unscheduled_closures
  classification: CLOSED
  status: CONFIRMED
  source:
  - id: tse-2001-09-12-closed
    ref: The TSE will remain closed today
  - id: tmx-2008-12-18-trading-resumes
    ref: 2:30PM - The decision was made to remain closed for the day
  rule:
    type: explicit_dates
    dates:
    - date: 2001-09-12
      comment: closed after the 11 September attacks; reopened 13 September
    - date: 2008-12-17
      comment: Level 1 market-data feed failure; 18-minute session then halted for
        the day
- key: ca_tsx_unscheduled_early_termination_2001
  name: Unscheduled Early Termination
  origin: module:ca_tsx_unscheduled_closures
  classification: EARLY_CLOSE
  close_time: 10:41
  status: CONFIRMED
  source:
  - id: tse-2001-09-11-market-closed
    ref: "the Toronto Stock Exchange has closed ... At the close of trading, the TSE\
      \ 300 Composite Index was down 293.86"
  - id: cbc-2002-09-11-tsx
    ref: opened trading for 71 minutes before shutting down (the only source for the
      time)
  rule:
    type: explicit_dates
    dates:
    - date: 2001-09-11
      comment: trading closed after the attacks in the United States
- key: ca_tsx_unscheduled_early_termination_2018
  name: Unscheduled Early Termination
  origin: module:ca_tsx_unscheduled_closures
  classification: EARLY_CLOSE
  close_time: 13:39
  status: CONFIRMED
  source:
  - id: tmx-2018-04-28-outage-update
    ref: "began at ... 1:39:13 pm EDT on TSX, TSXV, and TSX Alpha"
  rule:
    type: explicit_dates
    dates:
    - date: 2018-04-27
      comment: "trading-system hardware failure, no re-open"
- key: ca_tsx_unscheduled_early_termination_2020
  name: Unscheduled Early Termination
  origin: module:ca_tsx_unscheduled_closures
  classification: EARLY_CLOSE
  close_time: 13:54
  status: CONFIRMED
  source:
  - id: tmx-2020-02-27-incident-report
    ref: full market halt at 1:54 pm
  rule:
    type: explicit_dates
    dates:
    - date: 2020-02-27
      comment: "trading-engine capacity failure, no re-open"
