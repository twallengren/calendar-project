    ref: "Civic Holiday: Aug 3, 2026; Aug 4, 2025"
  rule:
    type: nth_weekday_of_month
    month: 8
    weekday: MONDAY
    nth: 1
- key: ca_civic_holiday_projected
  name: Civic Holiday
  origin: module:ca_civic_holiday
  classification: CLOSED
