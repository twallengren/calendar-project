  description: "Toronto Stock Exchange (TSX, MIC XTSE) trading calendar"
  chronology: ISO
  timezone: America/Toronto
  mic: XTSE
  coverage:
    from: 2000-01-01
    to: 2030-12-31
    verified_through: 2026-12-31
    quality:
    - scope: SCHEDULED_CLOSURES
      from: 2000-01-01
      to: 2007-12-31
      quality: PROJECTED
      evidence_ids:
      - tsx-calendar-page
      - holidays-act-canada
      - ontario-family-day-2007
    - scope: SCHEDULED_CLOSURES
      from: 2008-01-01
      to: 2025-12-31
      quality: VERIFIED
      evidence_ids:
