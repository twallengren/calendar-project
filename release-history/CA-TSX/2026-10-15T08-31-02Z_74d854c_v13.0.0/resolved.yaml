weekend_policy:
  days:
  - SATURDAY
  - SUNDAY
weekend_shift_policy: NEXT_AVAILABLE_WEEKDAY
resolution_chain:
- module:weekend_sat_sun
- module:ca_new_years_day
- module:ca_family_day
- module:ca_good_friday
- module:ca_victoria_day
- module:ca_canada_day
- module:ca_civic_holiday
- module:ca_labour_day
- module:ca_thanksgiving
- module:ca_christmas
- module:ca_boxing_day
- module:ca_tsx_unscheduled_closures
- module:ca_tsx_holidays
- calendar:CA-TSX
references:
- key: easter
  formula: EASTER_WESTERN
event_sources:
- key: ca_new_years_day
  name: New Year's Day
  origin: module:ca_new_years_day
  classification: CLOSED
  shiftable: true
  status: CONFIRMED
  source:
  - id: holidays-act-canada
  - id: tmx-holiday-schedule-2021
    ref: "Sat Jan 1, 2022 observed Mon Jan 3, 2022"
  rule:
    type: fixed_month_day
    month: 1
    day: 1
- key: ca_family_day
  name: Family Day
  origin: module:ca_family_day
  classification: CLOSED
  status: CONFIRMED
  active_years:
  - - 2008
    - null
  source:
  - id: ontario-family-day-2007
  - id: tsx-calendar-page
    ref: "Family Day: Feb 16, 2026; Feb 17, 2025"
  rule:
    type: nth_weekday_of_month
    month: 2
    weekday: MONDAY
    nth: 3
- key: ca_good_friday
  name: Good Friday
  origin: module:ca_good_friday
  classification: CLOSED
  status: CONFIRMED
  source:
  - id: holidays-act-canada
  - id: tsx-calendar-page
    ref: "Good Friday: Apr 3, 2026; Apr 18, 2025"
  rule:
    type: relative_to_reference
    reference: easter
    offset_days: -2
- key: ca_victoria_day
  name: Victoria Day
  origin: module:ca_victoria_day
  classification: CLOSED
  status: CONFIRMED
  source:
  - id: holidays-act-canada
    ref: Monday immediately preceding May 25
  - id: tsx-calendar-page
    ref: "Victoria Day: May 18, 2026; May 19, 2025"
  rule:
    type: relative_to_reference
    reference_month: 5
    reference_day: 25
    offset_weekday:
      weekday: MONDAY
      nth: 1
      direction: BEFORE
- key: ca_canada_day
  name: Canada Day
  origin: module:ca_canada_day
  classification: CLOSED
  shiftable: true
  status: CONFIRMED
  source:
  - id: holidays-act-canada
  - id: tmx-canada-day-2017
  - id: tmx-canada-day-2023
  rule:
    type: fixed_month_day
    month: 7
    day: 1
- key: ca_civic_holiday
  name: Civic Holiday
  origin: module:ca_civic_holiday
  classification: CLOSED
  status: CONFIRMED
  active_years:
  - - null
    - 2026
