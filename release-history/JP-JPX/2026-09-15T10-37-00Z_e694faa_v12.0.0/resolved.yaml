kind: resolved_calendar
id: JP-JPX
metadata:
  name: Japan Exchange Group (Tokyo Stock Exchange)
  description: "Tokyo Stock Exchange cash equity market trading calendar (MIC XTKS),\
    \ operated by Japan Exchange Group. Closed on Saturdays, Sundays, Japanese national\
    \ holidays, and JPX's own year-end and New Year market holidays (December 31 and\
    \ January 2-3)."
  chronology: ISO
  timezone: Asia/Tokyo
  mic: XTKS
  aliases:
  - XJPX
  coverage:
    from: 2010-01-01
    to: 2030-12-31
    verified_through: 2027-12-31
    quality:
    - scope: SCHEDULED_CLOSURES
      from: 2010-01-01
      to: 2018-12-31
      quality: PROJECTED
      evidence_ids:
      - cao-shukujitsu
      - jpx-market-holidays
    - scope: SCHEDULED_CLOSURES
      from: 2019-01-01
      to: 2027-12-31
      quality: VERIFIED
      evidence_ids:
      - jpx-market-holidays-archive
      - jpx-market-holidays
      - cao-shukujitsu
    - scope: SCHEDULED_CLOSURES
      from: 2028-01-01
      to: 2030-12-31
      quality: PROJECTED
      evidence_ids:
      - jpx-market-holidays
      - cao-shukujitsu-gaiyou
    - scope: EARLY_CLOSES
      from: 2010-01-01
      to: 2030-12-31
      quality: PROJECTED
      evidence_ids:
      - jpx-market-holidays
    - scope: UNSCHEDULED_EXCEPTIONS
      from: 2010-01-01
      to: 2030-12-31
      quality: PROJECTED
      evidence_ids:
      - jpx-system-failure-2020
weekend_policy:
  days:
  - SATURDAY
  - SUNDAY
weekend_shift_policy: NEXT_AVAILABLE_FROM_LAST_WEEKEND_DAY
resolution_chain:
- module:weekend_sat_sun
- module:jp_new_years_day
- module:jp_coming_of_age_day
- module:jp_national_foundation_day
- module:jp_emperors_birthday
- module:jp_vernal_equinox_day
